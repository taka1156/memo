name: Build MEMO index

# メモ（docs/*.html）が push されたら、一覧と各ページのアイコン・OGP タグを再生成してコミットする。
# GitHub の画面から HTML を直接アップロードしても一覧に載る。
on:
  push:
    branches: [master]
    paths:
      - "docs/*.html"
      - "docs/CNAME" # ドメインが変わったら OGP の URL も更新
      - "scripts/memo.py"
      - "docs/assets/og.png" # 差し替えたら og:image の ?v= を更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # memo:date がないメモの日付を git 履歴から推定するため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint memos (report only)
        run: python3 scripts/memo.py lint $(ls docs/*.html | grep -v '/index.html$') || true

      - name: Build index
        run: python3 scripts/memo.py build

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs; then
            echo "docs は最新です"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild MEMO index"
          git push
