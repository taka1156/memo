<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMO</title>
<meta name="description" content="Claude に作ってもらった解説ページの置き場">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1c2230;
  --fg-2: #5a6376;
  --line: #dde1e8;
  --accent: #0077b6;
  --chip: #eceff4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14;
    --surface: #111823;
    --fg: #cdd9e5;
    --fg-2: #7d8b9d;
    --line: #1e2d3d;
    --accent: #00d4ff;
    --chip: #18222f;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  min-height: 100vh;
  padding: 48px 16px 64px;
}
.wrap { max-width: 880px; margin: 0 auto; }
header { margin-bottom: 28px; }
h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.lead { color: var(--fg-2); font-size: 0.85rem; margin-top: 6px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
#q {
  flex: 1 1 220px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 0.9rem;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 4px 11px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  cursor: pointer;
}
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card h2 { font-size: 1rem; font-weight: 700; }
.card p { font-size: 0.82rem; color: var(--fg-2); line-height: 1.6; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--fg-2); }
.meta span.t { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
.meta time { margin-left: auto; }
.empty { color: var(--fg-2); font-size: 0.85rem; padding: 24px 0; }
footer { margin-top: 40px; font-size: 0.75rem; color: var(--fg-2); }
footer a { color: var(--accent); }
</style>
<!-- memo:head（scripts/memo.py が自動生成。手で編集しない） -->

<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">

<meta property="og:url" content="https://memo.taka1156.site/">
<meta property="og:image" content="https://memo.taka1156.site/assets/og.png">

</head>
<body>
<div class="wrap">
  <header>
    <h1>MEMO</h1>
    <p class="lead">Claude に作ってもらった解説ページの置き場</p>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="検索…" aria-label="メモを検索">
    <div class="tags" id="tags"></div>
  </div>

  <div class="grid" id="list"></div>
  <p class="empty" id="empty" hidden>該当するメモがありません</p>

  <footer>
    <a href="https://github.com/taka1156/memo">github.com/taka1156/memo</a>
  </footer>
</div>

<script>
// メモ一覧は各メモの <meta> から自動生成されます（README 参照）
// MEMOS:BEGIN（scripts/memo.py build が自動生成。手で編集しない）
const MEMOS = [
  {
    "file": "ecma.html",
    "title": "Ecma TC 一覧",
    "desc": "Ecma International の技術委員会 (TC39 など) をカードで一覧表示。",
    "tags": [
      "JavaScript",
      "標準化"
    ],
    "date": "2026-10-31"
  },
  {
    "file": "docker.html",
    "title": "Docker 動作原理",
    "desc": "イメージのレイヤー構造、名前空間、cgroups などコンテナが動く仕組みを図解。",
    "tags": [
      "Docker",
      "Linux"
    ],
    "date": "2026-10-31"
  }
];
// MEMOS:END

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const q = document.getElementById('q');
const tagBox = document.getElementById('tags');
let activeTag = null;

const allTags = [...new Set(MEMOS.flatMap(m => m.tags || []))].sort();
for (const t of allTags) {
  const b = document.createElement('button');
  b.className = 'tag';
  b.textContent = t;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => {
    activeTag = activeTag === t ? null : t;
    tagBox.querySelectorAll('.tag').forEach(x =>
      x.setAttribute('aria-pressed', String(x.textContent === activeTag)));
    render();
  };
  tagBox.appendChild(b);
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render() {
  const word = q.value.trim().toLowerCase();
  const items = MEMOS
    .filter(m => !activeTag || (m.tags || []).includes(activeTag))
    .filter(m => !word || [m.title, m.desc, ...(m.tags || [])].join(' ').toLowerCase().includes(word))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  list.innerHTML = items.map(m => `
    <a class="card" href="${esc(m.file)}">
      <h2>${esc(m.title)}</h2>
      <p>${esc(m.desc || '')}</p>
      <div class="meta">
        ${(m.tags || []).map(t => `<span class="t">${esc(t)}</span>`).join('')}
        ${m.date ? `<time>${esc(m.date)}</time>` : ''}
      </div>
    </a>`).join('');
  empty.hidden = items.length > 0;
}

q.addEventListener('input', render);
render();
</script>
</body>
</html>
