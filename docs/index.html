<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1c2230;

  --line: #dde1e8;
  --accent: #0077b6;
  --chip: #eceff4;
  --ok: #1a7f37;
  --ng: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14;
    --surface: #111823;
    --fg: #cdd9e5;
    --fg-2: #7d8b9d;
    --line: #1e2d3d;
    --accent: #00d4ff;
    --chip: #18222f;
    --ok: #3fb950;
    --ng: #f85149;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  min-height: 100vh;
  padding: 48px 16px 64px;
}
.wrap { max-width: 880px; margin: 0 auto; }
header { margin-bottom: 28px; }
h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.lead { color: var(--fg-2); font-size: 0.85rem; margin-top: 6px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
#q {
  flex: 1 1 220px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 0.9rem;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.refresh-btn {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg-2);
  border-radius: 8px;
  padding: 0 14px;
  font: 600 0.8rem 'JetBrains Mono', monospace;
  cursor: pointer;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
.refresh-btn svg { transition: transform .5s ease; }
.refresh-btn.spinning svg { animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 4px 11px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  cursor: pointer;
}
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card h2 { font-size: 1rem; font-weight: 700; }
.card p { font-size: 0.82rem; color: var(--fg-2); line-height: 1.6; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--fg-2); }
.meta span.t { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
.meta time { margin-left: auto; }
.empty { color: var(--fg-2); font-size: 0.85rem; padding: 24px 0; }
/* ランダムクイズ（普段は閉じておく） */
.rq { margin: -8px 0 20px; }
.rq > summary {
  display: inline-flex; align-items: center; gap: 6px;
  list-style: none; cursor: pointer; user-select: none;
  color: var(--fg-2);
  font: 600 0.75rem 'JetBrains Mono', monospace;
  padding: 4px 2px;
}
.rq > summary::-webkit-details-marker { display: none; }
.rq > summary::after { content: '▸'; display: inline-block; transition: transform .15s; }
.rq[open] > summary::after { transform: rotate(90deg); }
.rq > summary:hover { color: var(--accent); }
.rq-body {
  margin-top: 8px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.rq-from { font-size: 0.72rem; color: var(--fg-2); font-family: 'JetBrains Mono', monospace; }
.rq-q { font-weight: 700; margin: 4px 0 10px; line-height: 1.6; }
.rq-choices { display: flex; flex-direction: column; gap: 6px; }
.rq-c {
  text-align: left; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--chip); color: var(--fg);
  font: inherit; font-size: 0.88rem; line-height: 1.5; cursor: pointer;
}
.rq-c:hover:not(:disabled) { border-color: var(--accent); }
.rq-c:disabled { cursor: default; opacity: .6; }
.rq-c.ok { opacity: 1; border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.rq-c.ng { opacity: 1; border-color: var(--ng); box-shadow: inset 3px 0 0 var(--ng); }
.rq-fb { margin-top: 10px; font-size: 0.83rem; color: var(--fg-2); line-height: 1.6; }
.rq-fb b.ok { color: var(--ok); }
.rq-fb b.ng { color: var(--ng); }
.rq-actions { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 12px; }
.rq-actions a { color: var(--accent); font-size: 0.8rem; font-weight: 700; text-decoration: none; }
.rq-actions a:hover { text-decoration: underline; }
.rq-actions a.rq-more { margin-left: auto; color: var(--fg-2); font-weight: 600; font-size: 0.75rem; }
.rq-actions a.rq-more:hover { color: var(--accent); }
.rq-next {
  border: 1px solid var(--line); background: var(--chip); color: var(--fg-2);
  border-radius: 999px; padding: 4px 12px;
  font: 600 0.75rem 'JetBrains Mono', monospace; cursor: pointer;
}
.rq-next:hover { border-color: var(--accent); color: var(--accent); }
footer { margin-top: 40px; font-size: 0.75rem; color: var(--fg-2); }
footer a { color: var(--accent); }

  {"file": "web-components.html", "title": "Web Components", "q": "Shadow DOM を使った部品の中のボタンの色を、使う側のテーマに合わせて変えさせたい。部品側で用意すべきものは？", "choices": ["var(--button-color, 既定値) のような CSS 変数の受け口", "!important を外すこと", "使う側に .component button のセレクタを書いてもらう"], "answer": 0, "explain": "普通のセレクタは Shadow DOM の中に届かない。CSS 変数は境界を越えて継承されるので、テーマの公式な受け口になる。", "ref": "#styling"},
  {"file": "web-components.html", "title": "Web Components", "q": "Shadow DOM 内に input を持つ自作の日付入力を form に入れたが、送信データに値が含まれない。対処は？", "choices": ["form に novalidate を付ける", "formAssociated を有効にし、ElementInternals の setFormValue で値を渡す", "Shadow DOM の mode を open にする"], "answer": 1, "explain": "Shadow DOM 内の入力欄は外のフォームに参加しない。部品自体をフォーム部品にする仕組みが ElementInternals。", "ref": "#a11y"},
  {"file": "web-components.html", "title": "Web Components", "q": "部品の Shadow DOM の中にある button 要素から、bubbles: true だけを付けた CustomEvent を dispatchEvent した。document.addEventListener で受け取れない原因は？", "choices": ["CustomEvent は Shadow DOM では使えない", "composed: true がないので、shadow root で止まっている", "イベント名にハイフンが必要"], "answer": 1, "explain": "Shadow DOM の中から出したイベントは composed: true でないと境界を越えない。ホスト要素自身（this）から出すなら bubbles: true だけで届く。", "ref": "#events"},
  {"file": "web-components.html", "title": "Web Components", "q": "コピーボタン部品で、使う側が書いた子要素のテキスト（ボタンの文字用の slot=\"label\" は除く）だけを取りたい。適切な取り方は？", "choices": ["this.textContent を読む", "this.shadowRoot.textContent を読む", "名前なし slot の assignedNodes() から集める"], "answer": 2, "explain": "this.textContent には slot=\"label\" の子も混ざり、shadowRoot.textContent には slot に映った中身が入らない（スタイルなどの文字は入る）。名前なし slot に割り当てられたノードだけを集めるのが確実。", "ref": "#tree"},
  {"file": "vinext.html", "title": "vinext と Next.js の比較", "q": "既存の Next.js アプリに vinext を試すとき、ほかの作業より前にまず実行しておくべきコマンドは？", "choices": ["npx create-vinext-app で新規作成し直す", "npx vinext check で互換性の問題をスキャンする", "next.config を削除して vite.config.ts に書き直す"], "answer": 1, "explain": "vinext check で非対応 API を先に洗い出す。vinext init は非破壊で、next.config やソースは書き換えない。", "ref": "#migrate"},
  {"file": "vinext.html", "title": "vinext と Next.js の比較", "q": "vinext で Cloudflare Workers に載せたアプリから D1 や KV を使いたい。どう書くのが推奨？", "choices": ["import { env } from \"cloudflare:workers\" でバインディングを読む", "process.env.DB で接続文字列を読む", "getPlatformProxy() とカスタム worker エントリを用意する"], "answer": 0, "explain": "RSC 環境が workerd で動くため、cloudflare:workers の env からそのままバインディングを使える。", "ref": "#deploy"},
  {"file": "vinext.html", "title": "vinext と Next.js の比較", "q": "vinext で output: \"export\"（SSG）にしたサイトで、フォーム送信を Server Actions で処理しようとした。どうなる？", "choices": ["ビルド時に実行されて結果が HTML に固定される", "静的ホストの CDN が代わりに実行する", "実行時のサーバーが無いので使えない。外部 API などに送る必要がある"], "answer": 2, "explain": "Server Actions も middleware もリクエスト時に動くサーバーが必要。静的書き出しでは SSR・ISR とあわせて使えない。", "ref": "#deploy"},
  {"file": "vinext.html", "title": "vinext と Next.js の比較", "q": "vinext を Node.js の standalone 出力で複数台にスケールアウトした。ISR のキャッシュについて注意すべき点は？", "choices": ["既定の MemoryCacheHandler はプロセスごとなので、共有したいなら自前の CacheHandler を差し込む", "Workers Cache が自動で使われるので何もしなくてよい", "standalone 出力では ISR 自体が使えない"], "answer": 0, "explain": "既定はプロセス内メモリ。本番では Redis などの共有ストアを使う CacheHandler に差し替える。", "ref": "#deploy"},
  {"file": "vinext.html", "title": "vinext と Next.js の比較", "q": "公式ベンチで vinext のビルドが Next.js より約 4 倍速かった。ここから言えることは？", "choices": ["本番でのページ表示も約 4 倍速くなる", "ビルドとバンドルが速く小さいだけで、配信速度は別に比べる必要がある", "Next.js の静的事前生成より常に有利になる"], "answer": 1, "explain": "ベンチが測っているのはビルド時間とバンドルサイズだけ。本家は静的ページをビルド時に作るので、配信では本家が有利な場面もある。", "ref": "#compare"},
  {"file": "ui-design-styles.html", "title": "UI デザインスタイル早見表", "q": "白い背景の上に、半透明にしたグラスモーフィズムのカードを置いたが、ガラスらしく見えない。理由は？", "choices": ["背後のぼかしが主役なので、色のある背景がないと効果が出ないから", "border-radius と枠線を付けていないから", "透明度が足りず、背景の白が透けていないから"], "answer": 0, "explain": "グラスモーフィズムは「半透明にすればいい」わけではない。背後に色や写真があって初めてすりガラス感が出る。", "ref": "#myths"},
  {"file": "ui-design-styles.html", "title": "UI デザインスタイル早見表", "q": "情報量が多く、毎日長時間使う業務系の管理画面を作る。ベースにするスタイルとして無難なのは？", "choices": ["クレイモーフィズム", "ニューモーフィズム", "フラット 2.0"], "answer": 2, "explain": "シンプルさと操作性のバランスがよく、可読性も高い。ニューモーフィズムはコントラスト不足、クレイは情報量の多い画面に不向き。", "ref": "#compare"},
  {"file": "ui-design-styles.html", "title": "UI デザインスタイル早見表", "q": "ボタンをすべてニューモーフィズムにしたら、使いにくいと言われた。主な原因は？", "choices": ["CSS では再現できず画像になっているから", "コントラストが低く、押した状態とも区別しにくいから", "影の数が少なく、立体感が足りないから"], "answer": 1, "explain": "WCAG の基準を満たしにくい。使うなら小さな部品のアクセント程度にとどめる。", "ref": "#neu"},
  {"file": "ui-design-styles.html", "title": "UI デザインスタイル早見表", "q": "フラットデザインのアプリで「どこが押せるのかわからない」という声が出た。どう手直しする？", "choices": ["装飾をさらに減らして色も 1 色にする", "ボタンにだけ控えめな影や角丸を戻す", "全体をスキューモフィズムに作り直す"], "answer": 1, "explain": "フラットの弱点は「ボタンとただの色面の区別がつきにくい」こと。薄い影で浮いていることを示すだけで押せる場所が伝わる。", "ref": "#flat2"},
  {"file": "ui-design-styles.html", "title": "UI デザインスタイル早見表", "q": "記事の読みやすさは保ちつつ、画面に今っぽい奥行きも出したい。スタイルの使い方として一般的なのは？", "choices": ["本文はフラット 2.0 にし、上に浮くナビやモーダルだけをガラス表現にする", "1 つのスタイルを選んだら全画面で統一しなければならない", "すべての要素をグラスモーフィズムで統一する"], "answer": 0, "explain": "層ごとに使い分けるのが一般的。Liquid Glass もナビゲーション層に使い、内容はフラットに保つ前提。", "ref": "#myths"},
  {"file": "solid.html", "title": "SOLID と依存性逆転", "q": "注文処理のロジックが MySQL のリポジトリクラスを直接 import している。DB を差し替えても注文ロジックを書き直さずに済むようにするには、インターフェースをどこに置く？", "choices": ["infra 層に置き、MySQL クラスの隣で定義する", "ドメイン（注文処理を使う側）に置き、MySQL クラスがそれを実装する", "共通の utils フォルダに置き、どちらからも参照する", "インターフェースは作らず DI コンテナに任せる"], "answer": 1, "explain": "DIP では抽象を上位（使う側）が所有する。下位がその約束を実装することで、依存の向きが詳細→抽象に逆転する。", "ref": "#who-owns"},
  {"file": "solid.html", "title": "SOLID と依存性逆転", "q": "コンストラクタで OrderRepository を受け取るようにしたが、引数の型は MySqlOrderRepository（具体クラス）のまま。この状態の説明として正しいのは？", "choices": ["DI はしているが、DIP はまだできていない", "DIP はできているが、DI はできていない", "DI も DIP もできている", "DI コンテナがないのでどちらもできていない"], "answer": 0, "explain": "外から渡しているので DI ではあるが、具体クラスに依存しているので依存の向きは逆転していない。", "ref": "#dip-di-ioc"},
  {"file": "solid.html", "title": "SOLID と依存性逆転", "q": "経理の依頼で給与計算を直したら、人事向けの勤怠レポートの出力が変わってしまった。どの原則に違反している可能性が高い？", "choices": ["リスコフの置換原則", "インターフェース分離の原則", "単一責任の原則", "開放閉鎖の原則"], "answer": 2, "explain": "変更の理由（依頼元）が異なる処理が 1 つのクラスに同居していると、片方の修正がもう片方を壊す。", "ref": "#principles"},
  {"file": "solid.html", "title": "SOLID と依存性逆転", "q": "Storage インターフェースを実装した ReadOnlyStorage の save() が例外を投げる。呼び出し側に instanceof の分岐が増えてきた。どう直すのが筋がいい？", "choices": ["save() の中で何もしないようにして例外を消す", "呼び出し側の instanceof チェックを共通関数にまとめる", "Storage を継承した別クラスで save() をオーバーライドし直す", "読み取りと書き込みのインターフェースを分け、ReadOnlyStorage は読み取りだけを実装する"], "answer": 3, "explain": "できないことを型で表すのがリスコフ置換の守り方。黙って何もしないのは約束違反を隠すだけ。", "ref": "#principles"},
  {"file": "solid.html", "title": "SOLID と依存性逆転", "q": "オニオンアーキテクチャで、依存の矢印がすべてドメインに向かうように作る一番の理由は？", "choices": ["変わりにくい業務ルールを、変わりやすい DB やフレームワークの変更から守るため", "処理速度を上げるため", "フォルダ数を減らして見通しをよくするため", "ドメイン層から DB に直接アクセスできるようにするため"], "answer": 0, "explain": "変わりやすい側が変わりにくい側に合わせる構造にすると、変更の波及が外側で止まり、中心のテストも容易になる。", "ref": "#onion-link"},
  {"file": "security-headers.html", "title": "セキュリティヘッダー", "q": "自前のインライン script を残したまま、XSS で注入されたスクリプトは CSP で止めたい。どうする？", "choices": ["script-src に 'unsafe-inline' を足す", "レスポンスごとにランダムな nonce を発行し、ヘッダーと自分の script タグの両方に入れる", "script-src に自ドメインと CDN のホスト名を列挙する", "<meta> で CSP を書けばインラインだけ許可される"], "answer": 1, "explain": "nonce は攻撃者が知らない値なので、注入されたタグには付けられない。'unsafe-inline' は注入スクリプトも許してしまい、ホストの列挙はインラインを区別できない。", "ref": "#csp"},
  {"file": "security-headers.html", "title": "セキュリティヘッダー", "q": "http→https のリダイレクトと HSTS を設定済み。それでも、公衆 Wi-Fi で初めてサイトを開くユーザーが SSL ストリップされうるのはなぜ？", "choices": ["HSTS は https 化後のページにしか効かず、Cookie を守らないから", "max-age が 1 年未満だから", "HSTS はブラウザが一度受け取るまで効かず、初回の http リクエストは守れないから（preload で解消）", "includeSubDomains を付けていないから"], "answer": 2, "explain": "HSTS は受け取った後から効く。初回から https を強制するには、ブラウザに組み込まれる HSTS preload リストへの登録が必要。", "ref": "#hsts"},
  {"file": "security-headers.html", "title": "セキュリティヘッダー", "q": "ユーザーがアップロードしたファイルを自ドメインで配信している。中身が JS の .txt を <script src> で読み込ませる攻撃を、ヘッダーで止めるには？", "choices": ["X-Content-Type-Options: nosniff を付け、正しい Content-Type で返す", "Referrer-Policy: no-referrer を付ける", "Cross-Origin-Opener-Policy: same-origin を付ける", "X-XSS-Protection: 1; mode=block を付ける"], "answer": 0, "explain": "nosniff があると、script として読み込まれたリソースの MIME タイプが JavaScript でなければブラウザはブロックする。自ドメインなので CSP の 'self' だけでは止まらない。", "ref": "#nosniff"},
  {"file": "security-headers.html", "title": "セキュリティヘッダー", "q": "<meta http-equiv=\"Content-Security-Policy\"> で frame-ancestors 'none' を書いたのに、他サイトの iframe に埋め込めてしまう。原因は？", "choices": ["frame-ancestors は default-src で上書きされる", "X-Frame-Options のほうが優先されるから", "iframe 側の sandbox 属性で無効化されたから", "frame-ancestors は <meta> では無視され、レスポンスヘッダーでしか効かない"], "answer": 3, "explain": "frame-ancestors・report-to・sandbox は meta の CSP では使えない。埋め込み制限はレスポンスヘッダーの CSP（か X-Frame-Options）で送る。", "ref": "#framing"},
  {"file": "security-headers.html", "title": "セキュリティヘッダー", "q": "セッション Cookie を XSS で持ち出されないようにしたい。どの属性？", "choices": ["Secure", "HttpOnly", "SameSite=Strict", "Domain=example.com"], "answer": 1, "explain": "HttpOnly の Cookie は document.cookie から読めない。Secure は盗聴、SameSite はクロスサイト送信（CSRF）向けで、Domain 指定はむしろ送信範囲を広げる。", "ref": "#cookie"},
  {"file": "s3-compatible.html", "title": "S3 互換ストレージの仕組み", "q": "S3 互換ストレージで、キー 2026/11/ 以下にある「サブフォルダ」の一覧だけを取りたい。ListObjectsV2 にどう指定する？", "choices": ["prefix=2026/11/ を指定し、結果の Contents からキー名を加工する", "prefix=2026/11/ と delimiter=/ を指定し、CommonPrefixes を見る", "フォルダは HeadBucket で取得する"], "answer": 1, "explain": "フォルダは実在せず、delimiter を渡すと次の区切りまでで束ねたものが CommonPrefixes として返る。", "ref": "#folders"},
  {"file": "s3-compatible.html", "title": "S3 互換ストレージの仕組み", "q": "localhost:9000 で動かしているセルフホストの S3 互換ストレージに AWS SDK で接続したら、ホスト名の解決に失敗した。まず見直す設定は？", "choices": ["アクセスキーを作り直す", "マルチパートのパートサイズを小さくする", "path-style（forcePathStyle）を有効にする"], "answer": 2, "explain": "既定の virtual-hosted 形式だと バケット名.localhost を引きに行く。セルフホストでは path-style でパスにバケット名を入れる。", "ref": "#addressing"},
  {"file": "s3-compatible.html", "title": "S3 互換ストレージの仕組み", "q": "200 GiB のファイルを AWS S3 にマルチパートでアップロードしたい。パートサイズ 16 MiB では何が問題になる？", "choices": ["パート数が 10,000 を超えてしまう", "パートが 5 MiB 未満になってしまう", "1 回の PUT の上限 5 GB を超えるのでマルチパートは使えない"], "answer": 0, "explain": "200 GiB ÷ 16 MiB = 12,800 パートで上限 10,000 を超える。パートサイズを 21 MiB 以上にする。", "ref": "#multipart"},
  {"file": "s3-compatible.html", "title": "S3 互換ストレージの仕組み", "q": "複数のワーカーが同じ manifest.json を読んで更新して書き戻している。他のワーカーの更新を消さないためには？", "choices": ["書き込み前に HeadObject で存在を確認する", "読んだときの ETag を If-Match に付けて PUT し、412 なら読み直す", "PUT の前に 1 秒待つ"], "answer": 1, "explain": "S3 にはロックがない。If-Match による条件付き書き込みで、読んだ後に誰かが更新していたら 412 で失敗させる（互換ストレージの対応は要確認）。", "ref": "#consistency"},
  {"file": "s3-compatible.html", "title": "S3 互換ストレージの仕組み", "q": "AWS SDK を新しくしたら、これまで動いていた互換ストレージへの PutObject がエラーになった。考えられる原因と対処は？", "choices": ["SDK が既定でチェックサムを付けるようになったので、request_checksum_calculation を when_required にする", "署名が SigV2 に戻ったので SigV4 を指定する", "互換ストレージは最新 SDK を受け付けないので、旧版に固定するしかない"], "answer": 0, "explain": "2025 年初めから AWS SDK はアップロード時に CRC32 などのチェックサムを既定で送る。未対応の相手には、必要なときだけ送る設定に戻す。", "ref": "#checksum"},
  {"file": "rust.html", "title": "Rust 学習フローと仕組み", "q": "String を関数に渡したあと、元の変数をもう一度使ったら borrow of moved value になった。所有権を手放さずに関数に使わせるには？", "choices": ["関数の中で drop を呼ばないようにする", "変数を let mut にする", "&s のように参照（借用）で渡す"], "answer": 2, "explain": "値を渡すと所有権がムーブする。借用なら所有権は元の変数に残る。とりあえず動かすなら clone() でもよい。", "ref": "#ownership"},
  {"file": "rust.html", "title": "Rust 学習フローと仕組み", "q": "let first = &v[0]; のあとに v.push(4); を書き、その後で first を使うとコンパイルエラーになる。なぜ禁止されている？", "choices": ["push で再確保されると、first が解放済みのメモリを指すから", "first を let mut で宣言していないから", "let で作った Vec には、後から要素を追加できないから"], "answer": 0, "explain": "共有参照がある間は可変借用できない。first を最後に使った後なら push できる（NLL）。", "ref": "#borrow"},
  {"file": "rust.html", "title": "Rust 学習フローと仕組み", "q": "let b = a; のあと、a が i32 なら両方使えるのに、String だと a が使えなくなる。違いは？", "choices": ["String は不変なので、別の変数に代入できないから", "i32 は Copy 型で複製され、String はムーブになるから", "i32 は参照で、String は値だから"], "answer": 1, "explain": "ヒープを持つ型までコピーすると二重解放の危険があるので、明示的な clone() を求める設計。", "ref": "#own-copy"},
  {"file": "rust.html", "title": "Rust 学習フローと仕組み", "q": "設定ファイルの読み込みが失敗しうる関数で、失敗を呼び出し元に返したい。どう書く？", "choices": ["失敗したら panic! でメッセージを出して終了する", "戻り値を Result<T, E> にして、? でエラーを早期リターンする", "unwrap() で値を取り出し、失敗したらその場で止める"], "answer": 1, "explain": "回復できる失敗は Result、回復不能なバグは panic!。unwrap() は試作用。", "ref": "#err"},
  {"file": "rust.html", "title": "Rust 学習フローと仕組み", "q": "コードを書きながら、型や借用のエラーだけを素早く確認したい。どのコマンドを使う？", "choices": ["cargo check", "cargo clippy", "cargo build --release"], "answer": 0, "explain": "cargo check は実行ファイルを作らずにチェックだけ行うので速い。clippy はより Rust らしい書き方の提案。", "ref": "#commands"},
  {"file": "rendering-strategies.html", "title": "レンダリング戦略", "q": "社内向けの管理画面（ログイン必須、検索エンジンに載せない）を作る。サーバー運用をできるだけ減らしたい。合う方式は？", "choices": ["SSR", "CSR（SPA）を静的ホスティングで配る", "ISR"], "answer": 1, "explain": "SEO や初回表示の中身が不要なら、静的ファイルを配るだけの CSR が一番運用が軽い。", "ref": "#choose"},
  {"file": "rendering-strategies.html", "title": "レンダリング戦略", "q": "SSR したページで、表示されたボタンを押しても 1〜2 秒反応しないことがある。主な原因は？", "choices": ["CDN のキャッシュが効いていない", "HTML は届いているが、JS の取得とハイドレーションが終わるまでイベントがつながっていない", "SSR では onClick が使えない"], "answer": 1, "explain": "SSR の HTML は見た目だけ。同じコンポーネントの JS を実行してイベントをつなぐまで操作できない。", "ref": "#hydration"},
  {"file": "rendering-strategies.html", "title": "レンダリング戦略", "q": "コンポーネントで new Date().toLocaleTimeString() を描画したら、hydration mismatch の警告が出た。適切な直し方は？", "choices": ["時刻はマウント後（useEffect など）に入れる", "サーバー側のタイムゾーンを UTC に固定する", "警告を無効にする"], "answer": 0, "explain": "サーバーとブラウザで描画時刻もロケールも違うので一致しない。ブラウザでしか決まらない値はマウント後に入れる。", "ref": "#hydration"},
  {"file": "rendering-strategies.html", "title": "レンダリング戦略", "q": "EC サイトの商品ページ（数万件）。価格は 1 日数回変わる程度で、ビルド時間とサーバー負荷の両方を抑えたい。合う方式は？", "choices": ["全ページを毎回 SSR", "全ページを SSG してデプロイのたびに再ビルド", "ISR で一定時間ごとに作り直す"], "answer": 2, "explain": "ISR はアクセスのあったページを期限ごとに裏で作り直す。全件ビルドも毎リクエストの処理も避けられる。", "ref": "#compare"},
  {"file": "rendering-strategies.html", "title": "レンダリング戦略", "q": "ページの中で 1 つの API だけが 2 秒かかり、全体の表示が遅れている。ページ全体を待たせずに済む方法は？", "choices": ["その部分を Suspense などで区切り、ストリーミング SSR で枠を先に送る", "SSG に変えて API を呼ばないようにする", "JS を defer にする"], "answer": 0, "explain": "ストリーミングなら準備できた部分から送れる。遅い部分は読み込み中の表示を置いて、後から同じレスポンスで差し込む。", "ref": "#timeline"},
  {"file": "redis-valkey.html", "title": "Redis と Valkey の仕組み", "q": "Redis / Valkey で在庫数を INCR / DECR で増減している。複数のアプリから同時に DECR が来ても、在庫が二重に減ったりしないのはなぜ？", "choices": ["キーごとに行ロックを取ってから更新しているから", "コマンドはメインスレッドが 1 つずつ最後まで実行し、途中で割り込まれないから", "I/O スレッドがコマンドを並列に実行し、最後に結果を合算するから"], "answer": 1, "explain": "コマンドの実行は 1 本のメインスレッドで順番に行われるため、単一コマンドはロックなしで原子的になる。I/O スレッドが担うのは通信と解析だけ。", "ref": "#event-loop"},
  {"file": "redis-valkey.html", "title": "Redis と Valkey の仕組み", "q": "本番の Redis / Valkey で、あるプレフィックスのキーを調べたい。他のクライアントへの影響が少ないのはどれ？", "choices": ["KEYS prefix:* を 1 回実行する", "I/O スレッドを増やしてから KEYS prefix:* を実行する", "SCAN 0 MATCH prefix:* COUNT 100 を繰り返す"], "answer": 2, "explain": "KEYS は全キーを一度に走査してメインスレッドをふさぐ。SCAN なら少しずつ返すので、合間に他のコマンドが実行できる。I/O スレッドを増やしても実行は 1 本のまま。", "ref": "#myths"},
  {"file": "redis-valkey.html", "title": "Redis と Valkey の仕組み", "q": "DB の手前に置く純粋なキャッシュとして使う。メモリが満杯になっても書き込みを止めたくない。maxmemory-policy はどれが合う？", "choices": ["allkeys-lfu", "noeviction", "volatile-ttl（キーには TTL を付けない）"], "answer": 0, "explain": "allkeys-* は全キーから使われていないものを消して空きを作る。noeviction は満杯で書き込みエラーになり、volatile-* は期限付きキーがなければ何も消せない。", "ref": "#expire"},
  {"file": "redis-valkey.html", "title": "Redis と Valkey の仕組み", "q": "Redis Cluster / Valkey Cluster で、ユーザーのカートとプロフィールを MULTI / EXEC でまとめて更新したい。キー名をどう付ける？", "choices": ["cart:user:1000 と profile:user:1000 のように同じ ID を含める", "{user:1000}:cart と {user:1000}:profile のように {} で共通部分を囲む", "キー名は何でもよい。クラスターが自動で同じノードに集める"], "answer": 1, "explain": "スロットは CRC16(key) mod 16384 で決まり、{} があればその中だけがハッシュされる。複数キーのコマンドは同じスロットのキー同士でしか使えない。", "ref": "#cl-cluster"},
  {"file": "redis-valkey.html", "title": "Redis と Valkey の仕組み", "q": "社内ツールのキャッシュに Redis 互換のサーバーを採用したい。条件は「OSI 承認の、できるだけ制約の緩いライセンス」で、JSON や全文検索は使わない。合うのは？", "choices": ["Redis 8 を AGPLv3 で使う", "Redis 7.4 を使う", "Valkey を使う"], "answer": 2, "explain": "Valkey は BSD 3-Clause で、コアは素の KVS。Redis 8 の AGPLv3 も OSI 承認だが条件は強めで、7.4 は RSALv2 / SSPLv1 のみ（OSI 非承認）。", "ref": "#compare"},
  {"file": "realtime-comm.html", "title": "リアルタイム通信", "q": "AI の回答を 1 文字ずつ画面に流したい。クライアントから送るのは最初の質問だけ。一番手軽な方式は？", "choices": ["WebSocket", "SSE（または fetch でストリームを読む）", "1 秒ごとのポーリング"], "answer": 1, "explain": "サーバー → クライアントの片方向で、普通の HTTP のまま流せる。WebSocket は双方向が必要なときに使う。", "ref": "#m-sse"},
  {"file": "realtime-comm.html", "title": "リアルタイム通信", "q": "WebSocket のチャットで、回線が切れて戻ったあとに一部のメッセージが表示されていなかった。なぜ？", "choices": ["WebSocket は届かなかったメッセージを自動で再送しないから", "WebSocket は UDP なので順序が入れ替わるから", "ブラウザが古いメッセージをキャッシュから消したから"], "answer": 0, "explain": "WebSocket には再接続も取りこぼしの再送もない。最後に受け取った ID を覚えて、再接続時に差分を取る仕組みを自分で作る。", "ref": "#m-ws"},
  {"file": "realtime-comm.html", "title": "リアルタイム通信", "q": "WebSocket サーバーを 2 台に増やしたら、同じチャットルームなのに一部の人にメッセージが届かなくなった。対策は？", "choices": ["クライアントの再接続間隔を短くする", "全サーバーで Pub/Sub を購読して中継するか、同じルームを同じサーバーに集める", "WebSocket を SSE に置き換える"], "answer": 1, "explain": "接続は各サーバーが持っているので、別サーバーの相手には直接送れない。共通のメッセージ基盤か、ルーム単位の振り分けが必要。", "ref": "#scale"},
  {"file": "realtime-comm.html", "title": "リアルタイム通信", "q": "Cookie で認証している WebSocket エンドポイントで、ハンドシェイク時に必ず確認すべきヘッダーは？", "choices": ["Origin", "Accept-Language", "Cache-Control"], "answer": 0, "explain": "WebSocket には CORS がかからず Cookie も送られるので、Origin を見ないと他サイトのページから勝手につながれる。", "ref": "#m-ws"},
  {"file": "pwa.html", "title": "PWA の仕組みとチェックリスト", "q": "sw.js を修正してデプロイしたのに、ユーザーの画面では古い動作のまま。よくある原因と対処は？", "choices": ["manifest.webmanifest のバージョン番号を上げ忘れている", "本番が HTTPS でないので、SW の更新が無視されている", "新しい SW が waiting で止まっている。skipWaiting() で切り替える"], "answer": 2, "explain": "旧 SW が動いている間、新しい SW はタブをすべて閉じるか skipWaiting() を呼ぶまで有効にならない。 sw.js 自体を HTTP キャッシュさせないことも大事。", "ref": "#lifecycle"},
  {"file": "pwa.html", "title": "PWA の仕組みとチェックリスト", "q": "ファイル名にハッシュが付いた CSS・JS・フォントをキャッシュする。合う戦略は？", "choices": ["Cache First", "Network First", "毎回ネットワークのみ"], "answer": 0, "explain": "中身が変わらない静的ファイルはキャッシュを先に見ると速くオフラインにも強い。更新はファイル名が変わることで反映される。", "ref": "#s1"},
  {"file": "pwa.html", "title": "PWA の仕組みとチェックリスト", "q": "API のレスポンスは常に最新を見せたいが、オフラインのときは前回の結果を出したい。合う戦略は？", "choices": ["Cache First", "Network First", "Stale-While-Revalidate"], "answer": 1, "explain": "オンラインなら最新を取り、失敗したらキャッシュを返す。回線が遅いとタイムアウトまで待たされる点に注意。", "ref": "#s2"},
  {"file": "pwa.html", "title": "PWA の仕組みとチェックリスト", "q": "sw.js を /js/sw.js に置いたら、トップページ（/）の通信を Service Worker が扱わない。理由は？", "choices": ["SW が制御できるのは置いた場所以下だけだから", "sw.js は .js フォルダに置くと読み込まれない", "トップページは SW の対象外という仕様"], "answer": 0, "explain": "通常はサイトのルートに置く。広げるにはサーバーが Service-Worker-Allowed ヘッダーを返す必要がある。", "ref": "#myths"},
  {"file": "pwa.html", "title": "PWA の仕組みとチェックリスト", "q": "iPhone のユーザーにも PWA をインストールしてもらいたい。どうする？", "choices": ["条件を満たせば Android と同じく自動で案内が出る", "自動の案内は出ないので、「共有 → ホーム画面に追加」の手順をページで案内する", "beforeinstallprompt でインストールボタンを出す"], "answer": 1, "explain": "iOS の Safari には自動のプロンプトも beforeinstallprompt もない。", "ref": "#platforms"},
  {"file": "passkeys.html", "title": "パスキー（WebAuthn）", "q": "パスキー対応サービスのユーザーテーブルが丸ごと流出した。攻撃者がそのデータでユーザーとしてログインできない理由は？", "choices": ["パスキーのデータは暗号化して保存されているから", "サーバーにあるのは公開鍵だけで、公開鍵では署名できないから", "流出してもパスキーは自動で失効するから"], "answer": 1, "explain": "ログインには秘密鍵での署名が必要で、秘密鍵はユーザーの端末やマネージャーから出ない。サーバー側の公開鍵は検証にしか使えない。", "ref": "#login"},
  {"file": "passkeys.html", "title": "パスキー（WebAuthn）", "q": "本物そっくりの偽サイトが、入力内容をリアルタイムで本物に中継する攻撃。SMS コードの二段階認証では防げないのに、パスキーでは防げるのはなぜ？", "choices": ["パスキーは署名がドメイン（RP ID・オリジン）に紐づき、ブラウザが偽ドメインでは使わせないから", "パスキーの方がコードの桁数が多いから", "パスキーは通信を暗号化するから"], "answer": 0, "explain": "SMS コードはただの文字列なので中継できる。パスキーはブラウザが今のオリジンを確認し、署名にもオリジンが含まれるので、偽ドメインからは本物で通る署名を得られない。", "ref": "#phishing"},
  {"file": "passkeys.html", "title": "パスキー（WebAuthn）", "q": "社内の管理者アカウントで、鍵がクラウドに同期されることを避けたい。合う構成は？", "choices": ["同期パスキーだけを許可する", "パスワード＋TOTP に戻す", "YubiKey などの端末固定パスキーを使い、予備のキーも登録する"], "answer": 2, "explain": "端末固定パスキーは鍵をコピーできず、そのハードウェアの中にしか存在しない。失くすと使えないので予備の登録が前提。", "ref": "#types"},
  {"file": "passkeys.html", "title": "パスキー（WebAuthn）", "q": "パスキーを導入したが「ボタンを探さないと使えない」と利用率が低い。ユーザー名欄の入力候補にパスキーを出すには？", "choices": ["パスワード欄を削除する", "ユーザー名欄に autocomplete=\"username webauthn\" を付け、mediation: 'conditional' で get() を呼ぶ", "ページを開いたら自動で create() を呼ぶ"], "answer": 1, "explain": "conditional mediation を使うと、パスワードの自動入力と同じ場所にパスキーが候補として並ぶ。勝手に create() を呼ぶと毎回登録ダイアログが出てしまう。", "ref": "#implement"},
  {"file": "js-web-standards.html", "title": "JS と Web 標準の決まり方", "q": "ブラウザでも Node.js・Cloudflare Workers でも動くライブラリを作りたい。依存してよい API の目安は？", "choices": ["TC55 の Minimum Common API（ECMA-429）に入っている API", "ブラウザで動く API なら何でもよい（document や localStorage も含む）", "Node.js の node: モジュールなら、他のランタイムでも必ず動く"], "answer": 0, "explain": "Minimum Common API は、サーバー側ランタイムが共通で実装する Web API の範囲。document や localStorage は入っておらず、node: モジュールは標準の外。", "ref": "#mca"},
  {"file": "js-web-standards.html", "title": "JS と Web 標準の決まり方", "q": "ブラウザでの setTimeout の正確な挙動（遅延の扱いなど）を仕様で確かめたい。どこを見る？", "choices": ["ECMAScript の仕様（ECMA-262）", "WHATWG の HTML Standard", "W3C の CSS の仕様"], "answer": 1, "explain": "タイマーとイベントループは言語ではなく HTML Standard で決まっている。Node.js は自前で実装しているので、挙動が違うことがある。", "ref": "#layers"},
  {"file": "js-web-standards.html", "title": "JS と Web 標準の決まり方", "q": "気になっていた JavaScript の提案が Stage 2.7 になった。本番のコードで使い始めてよい？", "choices": ["使ってよい。設計が完成したので全ブラウザに入っている", "使ってよい。Stage 2.7 からは名前や構文が変わらないことが保証されている", "まだ待つ。テストと試作で検証中で、ブラウザの実装が本格化するのは Stage 3 から"], "answer": 2, "explain": "Stage 2.7 は検証の段階で、テストや試作の結果によっては変わりうる。Stage 3 以降で、実装状況を確かめてから使う。", "ref": "#tc39"},
  {"file": "js-web-standards.html", "title": "JS と Web 標準の決まり方", "q": "HTML の仕様の最新の内容を確認したい。どれを見るのがよい？", "choices": ["WHATWG の HTML Living Standard", "W3C の HTML の勧告。WHATWG 版とは内容が別物", "W3C の勧告と WHATWG 版の両方を読み比べて、新しい方を採用する"], "answer": 0, "explain": "HTML と DOM の本体は WHATWG の Living Standard。W3C の勧告はそのスナップショットに承認を付けたもので、内容は同じ。", "ref": "#whatwg-w3c"},
  {"file": "js-web-standards.html", "title": "JS と Web 標準の決まり方", "q": "Workers から外部 API に fetch したら、ブラウザでは付いていた Origin ヘッダーや Cookie が送られていなかった。どう考える？", "choices": ["ランタイムのバグなので、修正を待つ", "サーバーにはページのオリジンや Cookie の保存場所がないので、付かないのが前提。必要なら自分でヘッダーを付ける", "CORS の設定を有効にすれば自動で付くようになる"], "answer": 1, "explain": "サーバー側の fetch には「今開いているページ」がない。Origin や Cookie が必要な API には、自分でヘッダーを組み立てて送る。", "ref": "#tc55"},
  {"file": "http-cache.html", "title": "HTTP キャッシュ", "q": "デプロイしても一部のユーザーに古い画面が出続ける。HTML に Cache-Control: max-age=86400 が付いていた。根本的な対策は？", "choices": ["CDN をパージする", "HTML は no-cache（毎回再検証）にし、JS/CSS はファイル名ハッシュで長期キャッシュする", "HTML も JS も no-store にする"], "answer": 1, "explain": "URL が固定の HTML を長くキャッシュすると、ブラウザに残った分はパージでも消せない。HTML は毎回再検証、中身が変わると URL も変わるアセットは長期キャッシュ、が定番。no-store はキャッシュの利点を全部捨ててしまう。", "ref": "#recipes"},
  {"file": "http-cache.html", "title": "HTTP キャッシュ", "q": "ブラウザにキャッシュされた ETag 付きレスポンスが古くなった。次のアクセスでサーバーの内容が変わっていなければ何が返る？", "choices": ["本文なしの 304 Not Modified", "同じ本文の 200 OK", "キャッシュが古いので 410 Gone"], "answer": 0, "explain": "ブラウザは If-None-Match で手元の ETag を送り、一致すればサーバーは本文なしの 304 を返す。ブラウザは手元のコピーを使い、鮮度もリセットされる。", "ref": "#flow"},
  {"file": "http-cache.html", "title": "HTTP キャッシュ", "q": "マイページの API 応答が CDN にキャッシュされ、別のユーザーに他人の情報が表示された。最低限付けるべき指定は？", "choices": ["Cache-Control: no-cache", "Cache-Control: public, max-age=0", "Cache-Control: private（機微な情報なら no-store）"], "answer": 2, "explain": "private は共有キャッシュ（CDN）への保存を禁止する。no-cache は保存自体は許すので、CDN に残り得る。", "ref": "#layers"},
  {"file": "http-cache.html", "title": "HTTP キャッシュ", "q": "Cache-Control: max-age=60, stale-while-revalidate=120 のレスポンスを受け取って 90 秒後にアクセスした。どうなる？", "choices": ["サーバーの返事を待ってから表示する", "古い版をすぐ表示し、裏でサーバーに確認して更新する", "キャッシュを使わず必ず 200 で取り直す"], "answer": 1, "explain": "60 秒を過ぎて古くなったが、そこから 120 秒間は SWR の猶予。古い版を即返しつつ裏で再検証するので、待たされない。", "ref": "#sim"},
  {"file": "http-cache.html", "title": "HTTP キャッシュ", "q": "同じ URL で、Accept-Language によって日本語版と英語版を返している。CDN 経由で日本人に英語版が出ることがある。何が足りない？", "choices": ["Vary: Accept-Language", "Cache-Control: immutable", "ETag"], "answer": 0, "explain": "Vary に書いたヘッダーの値ごとに、キャッシュは別々に保存する。無いと最初に保存された言語版を全員に返してしまう。", "ref": "#vary"},
  {"file": "git-internals.html", "title": "Git の内部構造", "q": "1000 回コミットしたリポジトリで、README.md は一度も変更していない。README.md の blob はいくつ保存されている？", "choices": ["1000 個（コミットごとに 1 つ）", "1 個（全コミットの tree から共有される）", "0 個（差分が無いので保存されない）"], "answer": 1, "explain": "blob の名前は中身のハッシュなので、同じ中身なら同じ blob が 1 つだけ。各コミットの tree がそれを指すだけになる。", "ref": "#graph"},
  {"file": "git-internals.html", "title": "Git の内部構造", "q": "誤って git branch -D feature で未マージのブランチを消してしまった。最初にやることは？", "choices": ["もう復元できないので作業をやり直す", "git revert でブランチ削除を取り消す", "git reflog で消える前の先端コミットを探し、そこにブランチを作り直す"], "answer": 2, "explain": "消えたのはポインタ（ref）だけで、コミットはまだ残っている。reflog でハッシュを見つけて git branch で立て直せばよい。", "ref": "#reflog"},
  {"file": "git-internals.html", "title": "Git の内部構造", "q": "チームで共有している develop ブランチ（push 済み）に main の最新を取り込みたい。安全なのは？", "choices": ["git merge main", "git rebase main して force push", "git reset --hard main"], "answer": 0, "explain": "merge は既存コミットを書き換えず新しいマージコミットを足すだけ。rebase はコミットを作り直すため、同じブランチを持つ他の人の履歴と食い違う。", "ref": "#merge-rebase"},
  {"file": "git-internals.html", "title": "Git の内部構造", "q": "直前のコミットに入れるべきファイルを入れ忘れた。変更は消さずに、コミットだけ作り直したい。合うのは？", "choices": ["git reset --hard HEAD~1", "git reset --soft HEAD~1", "git revert HEAD"], "answer": 1, "explain": "--soft はブランチだけを1つ前に戻し、インデックスと作業ツリーはそのまま。ファイルを add して commit し直せる（git commit --amend でも同じことができる）。", "ref": "#reset"},
  {"file": "git-internals.html", "title": "Git の内部構造", "q": "GitHub で feature を「Squash and merge」した後、同じ feature ブランチで作業を続けて再度 PR を出したら、前に取り込んだはずの変更まで差分に出てきた。なぜ？", "choices": ["squash で main 側のコミットが壊れたから", "GitHub のキャッシュが古いから", "squash したコミットは feature のコミットとつながっておらず、Git が取り込み済みと判定できないから"], "answer": 2, "explain": "squash merge は変更をまとめた新しいコミットを作るだけで、feature の元コミットを親に持たない。そのため Git から見ると feature の元コミットは main に未取り込みのまま。", "ref": "#merge-rebase"},
  {"file": "docker.html", "title": "Docker 動作原理", "q": "コンテナの中で設定ファイルを書き換えたあと、そのコンテナを削除した。書き換えた内容と元のイメージはどうなる？", "choices": ["イメージごと削除される", "書き換えはコンテナ用の書き込み層にだけあったので消え、イメージは元のまま", "書き換えはイメージに保存され、次に起動したコンテナにも残る"], "answer": 1, "explain": "書き込みは Copy-on-Write で upperdir（コンテナ層）にだけ入る。コンテナを消すと upperdir だけが消え、読み取り専用のイメージ層はそのまま再利用できる。", "ref": "#overlayfs"},
  {"file": "docker.html", "title": "Docker 動作原理", "q": "同じイメージからコンテナを 10 個起動した。ディスクの使われ方として正しいのは？", "choices": ["読み取り専用のイメージ層は共有し、各コンテナは自分の差分だけを持つ", "コンテナごとにイメージ全体がコピーされる", "最初の 1 個だけがイメージを持ち、残りは起動できない"], "answer": 0, "explain": "イメージ層は読み取り専用なので複数のコンテナで共有でき、書き込みは各コンテナの Container Layer に差分として入る。", "ref": "#layers"},
  {"file": "docker.html", "title": "Docker 動作原理", "q": "あるコンテナがメモリを使いすぎてホストが重くなる。コンテナのメモリを 512MB までに抑えるのに使われる仕組みは？", "choices": ["OverlayFS", "名前空間（namespace）", "cgroups（-m 512m）"], "answer": 2, "explain": "名前空間は「見える範囲」を分ける仕組みで、使える量を制限するのは cgroups。", "ref": "#cgroups"},
  {"file": "docker.html", "title": "Docker 動作原理", "q": "コンテナの中で ps を実行すると、自分のアプリが PID 1 に見え、ホストのプロセスは見えない。理由は？", "choices": ["cgroups がホストのプロセスを非表示にしているから", "PID 名前空間で、コンテナ専用のプロセス番号の空間が作られているから", "コンテナが仮想マシンとして別のカーネルで動いているから"], "answer": 1, "explain": "runc が PID 名前空間を作り、その中で CMD / ENTRYPOINT を PID 1 として起動する。カーネル自体はホストと共有している。", "ref": "#namespaces"},
  {"file": "docker.html", "title": "Docker 動作原理", "q": "コンテナと仮想マシンの違いとして正しいのは？", "choices": ["コンテナはホストのカーネルを共有し、隔離と制限をかけて動く", "コンテナもゲスト OS のカーネルを丸ごと起動している", "コンテナはカーネルを使わずにアプリを直接ハードウェアで動かす"], "answer": 0, "explain": "コンテナは普通のプロセスに隔離と制限をかけたもの。カーネルを共有するので起動が速く軽い。", "ref": "#vs-vm"},
  {"file": "docker-files.html", "title": "Dockerfile と Compose の書き方", "q": "ソースを 1 行直しただけなのに、docker build のたびに npm ci が最初から走って遅い。Dockerfile をどう直す？", "choices": ["RUN npm ci を CMD に移す", "package.json と lock ファイルだけを先に COPY して npm ci し、そのあとで COPY . . する", "FROM のタグを latest にする"], "answer": 1, "explain": "変わった行以降はすべて作り直されるので、変わりにくい依存定義を先に入れておけば、ソース変更では npm ci の層がキャッシュから使われる。", "ref": "#cache"},
  {"file": "docker-files.html", "title": "Dockerfile と Compose の書き方", "q": "本番イメージにコンパイラや devDependencies を入れずに、ビルド成果物だけを載せたい。どう書く？", "choices": ["ビルド後に RUN rm -rf でツールを消す", ".dockerignore にコンパイラを書く", "ビルド用と実行用のステージに分け、実行用で COPY --from=build して成果物だけ持ってくる"], "answer": 2, "explain": "RUN rm で消しても前の層には残るのでサイズは減らない。最終イメージは最後のステージだけなので、マルチステージで分けるのが正解。", "ref": "#multistage"},
  {"file": "docker-files.html", "title": "Dockerfile と Compose の書き方", "q": "compose で app から DATABASE_URL=postgres://…@localhost:5432 に接続すると失敗する。db サービスは動いている。どう直す？", "choices": ["ホスト名を db（サービス名）にする", "db に ports: \"5432:5432\" を足す", "app に EXPOSE 5432 を書く"], "answer": 0, "explain": "コンテナの中の localhost はそのコンテナ自身。同じ compose 内のコンテナにはサービス名で届く。ports はホストへの公開なので関係ない。", "ref": "#compose"},
  {"file": "docker-files.html", "title": "Dockerfile と Compose の書き方", "q": "docker compose up 直後、app が「DB に接続できない」で落ちる。depends_on: [db] は書いてある。何を足す？", "choices": ["restart: \"no\" を付ける", "db に healthcheck を書き、app の depends_on を condition: service_healthy にする", "db を app より上に書く"], "answer": 1, "explain": "素の depends_on は起動順しか保証しない。DB が接続を受け付けるまで待つには healthcheck と service_healthy の組み合わせが必要。", "ref": "#compose"},
  {"file": "docker-files.html", "title": "Dockerfile と Compose の書き方", "q": "docker stop すると毎回 10 秒待たされ、アプリの終了処理も動かない。Dockerfile の最後は CMD node server.js。原因は？", "choices": ["シェル形式なので sh が PID 1 になり、SIGTERM がアプリに届いていない", "EXPOSE を書いていないから", "USER を root にしていないから"], "answer": 0, "explain": "CMD [\"node\", \"server.js\"] の exec 形式にすると node が PID 1 になり SIGTERM が届く。PID 1 は既定では終了しないので、アプリで SIGTERM を処理するか --init（compose なら init: true）も使う。", "ref": "#exec-form"},
  {"file": "distributed-basics.html", "title": "分散システムの基本", "q": "東京と大阪の DB ノード間の通信が切れた。大阪で残高を読まれたとき「古い値を返すくらいならエラーにする」設計は、CAP のどれを選んでいる？", "choices": ["AP（可用性を優先）", "CP（整合性を優先）", "CA（分断を無視）", "PACELC の EL"], "answer": 1, "explain": "分断中に正しさを守るため応答を諦めるのが CP。古くても返すのが AP。", "ref": "#cap"},
  {"file": "distributed-basics.html", "title": "分散システムの基本", "q": "決済 API へのリクエストがタイムアウトした。二重課金を防ぎつつ安全にリトライするには？", "choices": ["タイムアウトを長くして 1 回だけ送る", "リトライ時は新しい UUID を冪等キーとして付け直す", "最初と同じ冪等キーを付けてリトライし、サーバーは処理済みなら前回の結果を返す", "リトライせず、ユーザーにもう一度ボタンを押してもらう"], "answer": 2, "explain": "冪等キーはリトライで使い回すのがポイント。キーを変えると別の操作と見なされ二重課金になる。", "ref": "#idem-key"},
  {"file": "distributed-basics.html", "title": "分散システムの基本", "q": "API が一時的に落ちた後、多数のクライアントが同じ間隔でリトライして復旧直後のサーバーがまた落ちた。何を足すべき？", "choices": ["リトライ間隔にランダムなずれ（ジッター）を加える", "リトライ回数を増やす", "リトライ間隔を短くして早く成功させる", "全クライアントのリトライ時刻を揃える"], "answer": 0, "explain": "指数バックオフだけだと全員が同じタイミングで再送する。ジッターで分散させると負荷の山が崩れる。", "ref": "#backoff"},
  {"file": "distributed-basics.html", "title": "分散システムの基本", "q": "在庫数を Workers KV に保存して、購入時に減らす実装にした。起こり得る問題は？", "choices": ["KV は書き込みができないので動かない", "結果整合性なので、古い在庫数を見て売り越しが起き得る", "KV は 1 か所にしかないので読み取りが遅くなる", "特に問題はない"], "answer": 1, "explain": "KV は書き込みが各地に届くまで古い値が返り得る。同時更新を正しく扱うなら Durable Objects や D1 のような強い整合性を持つ場所に置く。", "ref": "#cloudflare"},
  {"file": "distributed-basics.html", "title": "分散システムの基本", "q": "外部 API が 422 Unprocessable Content を返した。リトライの判断として適切なのは？", "choices": ["指数バックオフでリトライする", "すぐに 1 回だけリトライする", "Retry-After ヘッダーの秒数待ってリトライする", "リトライせず、リクエスト内容を見直す"], "answer": 3, "explain": "4xx の多くはリクエスト自体の問題で、何度送っても結果は変わらない（429 は例外）。", "ref": "#retry"},
  {"file": "design-tokens.html", "title": "デザイントークン", "q": "ダークモードに対応したい。トークンを 3 階層で組んでいる場合、主に差し替えるのはどの層？", "choices": ["プリミティブ層（パレットの値そのもの）", "コンポーネント層（各部品の変数）", "セマンティック層（用途名がどのプリミティブを指すか）", "全部の層を同じだけ"], "answer": 2, "explain": "セマンティック層の対応先を変えれば、それを参照する部品は自動で追従する。プリミティブは「使える色の一覧」なので変えない。", "ref": "#tiers"},
  {"file": "design-tokens.html", "title": "デザイントークン", "q": "セマンティックトークンに --color-light-blue という名前をつけた。後で困りやすいのはどんな場面？", "choices": ["ブランド色の変更やダークモードで、名前と実際の色が食い違う", "CSS 変数として使えなくなる", "Tailwind で読み込めなくなる", "特に困ることはない"], "answer": 0, "explain": "セマンティック層は用途で名付ける。見た目の名前だと、テーマが変わったとき名前が嘘になる。", "ref": "#naming"},
  {"file": "design-tokens.html", "title": "デザイントークン", "q": "ボタンの CSS に background: #0077b6; と直接書かれていて、ダークモードで読みにくい。トークンの考え方での直し方は？", "choices": ["ダーク用の @media を各ボタンの CSS に追加する", "ボタンは var(--color-accent) などのセマンティックトークンを参照し、テーマ側で対応先を切り替える", "色を中間の灰色にして両方で読めるようにする", "プリミティブの --blue-500 をダーク時に別の色に書き換える"], "answer": 1, "explain": "部品が生の値を直接持つとテーマごとに部品を直すことになる。部品はセマンティック名だけを知り、切り替えはテーマ側でまとめて行う。", "ref": "#css"},
  {"file": "design-tokens.html", "title": "デザイントークン", "q": "Web・iOS・Android の 3 つのアプリで同じ色と余白を使いたい。トークンの管理方法として向いているのは？", "choices": ["各プラットフォームで手作業で同じ値を書く", "Web の CSS をそのまま iOS に読み込ませる", "トークンを JSON などで 1 か所に定義し、変換ツールで各プラットフォーム用に出力する", "Figma のスクリーンショットから色を拾う"], "answer": 2, "explain": "1 か所を正として変換すれば、値のずれが起きない。DTCG 形式の JSON や Style Dictionary がこの用途。", "ref": "#tools"},
  {"file": "ddd-onion.html", "title": "DDD とオニオンアーキテクチャ", "q": "「完了済みのタスクはもう一度完了できない」という業務ルールを追加する。どこに書く？", "choices": ["Task エンティティの complete() メソッドの中", "Hono のルートハンドラ", "ユースケース（CompleteTaskUseCase）の if 文"], "answer": 0, "explain": "業務ルールはエンティティや値オブジェクトに閉じ込める。ユースケースは取り出して呼んで保存する段取り役。ルールがユースケースに散らばるとドメインモデル貧血症になる。", "ref": "#ddd-tac"},
  {"file": "ddd-onion.html", "title": "DDD とオニオンアーキテクチャ", "q": "ユースケースから DB に保存したいが、application 層は infrastructure 層を import してはいけない。どうする？", "choices": ["例外として application から D1 のクライアントを直接 import する", "リポジトリのインターフェースをドメインに置き、infrastructure でそれを実装する", "保存処理もドメインのエンティティに書く"], "answer": 1, "explain": "依存性逆転。どちらの矢印も内側を向くので、D1 を Postgres やメモリに替えても内側は変わらない。", "ref": "#onion"},
  {"file": "ddd-onion.html", "title": "DDD とオニオンアーキテクチャ", "q": "API の入力は Zod で検証している。それでも TaskTitle のような値オブジェクトを作る意味はある？", "choices": ["ない。値オブジェクトは DB の型を表すためのもの", "ある。値オブジェクトは別の入口から来ても業務ルールを守れる", "ない。Zod で検証済みなら二重チェックになるだけ"], "answer": 1, "explain": "値オブジェクトは生成時にルールを検証するので、作れた時点で正しい値であることが保証される。", "ref": "#myths"},
  {"file": "ddd-onion.html", "title": "DDD とオニオンアーキテクチャ", "q": "ユースケースの中でヘッダーやパラメーターを読みたいので、Hono の Context（c）をそのまま渡したくなった。どうするべき？", "choices": ["ハンドラで必要な値だけ取り出し、プレーンな引数として渡す", "c を渡して、ユースケースの中で c.req を読む", "ユースケースを Hono のミドルウェアとして書き直す"], "answer": 0, "explain": "c を渡すと application が Hono に依存し、テストにも Context が必要になる。", "ref": "#myths"},
  {"file": "ddd-onion.html", "title": "DDD とオニオンアーキテクチャ", "q": "CRUD が中心で業務ルールがまだ少ない新規 API を作る。構成の進め方としておすすめは？", "choices": ["層は分けず、ルートハンドラに業務ルールも DB アクセスも書く", "最初から 4 層のフォルダとクラスを全部用意する", "軽量版で始め、痛みが出た部分からフル版に寄せていく"], "answer": 2, "explain": "軽量版でも「ルールは task.ts だけ」「task.ts は FW や DB を import しない」「DB アクセスは task.repo.ts に閉じ込める」の 3 つは守る。", "ref": "#lite"},
  {"file": "db-internals.html", "title": "DB のしくみ", "q": "COMMIT が成功した直後に DB サーバーの電源が落ちた。データファイルにはまだ反映されていなかった。再起動後どうなる？", "choices": ["WAL を再生して、コミットした変更は復元される", "データファイルに無いので変更は失われる", "トランザクションが途中から再実行される"], "answer": 0, "explain": "COMMIT は WAL がディスクに確定した時点で成功を返す。再起動時に WAL を読み直して（REDO）データファイルを最新にするので、コミット済みの変更は消えない。", "ref": "#recovery"},
  {"file": "db-internals.html", "title": "DB のしくみ", "q": "昨日まで速かった同じ SQL が、データが急増した今日から急に遅くなった。SQL は一文字も変えていない。まず疑うべきは？", "choices": ["SQL の構文エラー", "プランナが選ぶ実行計画が変わった（EXPLAIN で確認する）", "WAL が壊れた"], "answer": 1, "explain": "どう取ってくるかはプランナが統計情報から毎回決める。データ量や分布が変わると別の計画が選ばれることがあるので、EXPLAIN で計画を比べる。", "ref": "#pipeline"},
  {"file": "db-internals.html", "title": "DB のしくみ", "q": "1台のサーバーで動く社内ツールに SQLite を使ったら、管理画面で重い書き込みをしている間に一覧画面の読み込みが止まる。まず試すことは？", "choices": ["PostgreSQL に移行する", "PRAGMA journal_mode = WAL にする", "DB ファイルを NFS に置いて分散させる"], "answer": 1, "explain": "既定のロールバックジャーナルでは書き込み中は読み込みも待たされる。WAL モードなら変更を別ファイルに追記するので、書き込み中も読み込みは止まらない（書き込みは引き続き1本ずつ）。", "ref": "#sqlite-wal"},
  {"file": "db-internals.html", "title": "DB のしくみ", "q": "SQLite で外部キーを定義したのに、存在しない親 ID を持つ行が普通に INSERT できてしまった。なぜ？", "choices": ["SQLite は外部キーに対応していないから", "STRICT テーブルにしていないから", "外部キー制約は既定で無効で、接続ごとに PRAGMA foreign_keys = ON が必要だから"], "answer": 2, "explain": "SQLite は互換性のため外部キーの検査を既定でオフにしている。接続を開くたびに PRAGMA foreign_keys = ON を実行する。", "ref": "#sqlite-setup"},
  {"file": "db-internals.html", "title": "DB のしくみ", "q": "D1 で全テナントのデータを 1 つの DB に入れていたら、利用者が増えて書き込みが詰まり始めた。D1 の仕組みに合った対策は？", "choices": ["テナントごとに DB を分け、書き込みを複数の DB に散らす", "読み取りレプリカを増やす", "同じ DB への書き込みをできるだけ並列に投げる"], "answer": 0, "explain": "D1 の各 DB はシングルスレッドでクエリを1つずつ処理するので、1 DB の書き込みには上限がある。D1 は大量の DB を持てる設計なので、分けて書き込みを散らすのが定石。レプリカは読み取り専用なので書き込みには効かない。", "ref": "#sqlite-cloud"},
  {"file": "db-index-transaction.html", "title": "インデックスとトランザクション", "q": "orders (user_id, created_at) の複合インデックスがある。「先週の全ユーザーの注文」を created_at だけで検索したら遅い。なぜ？", "choices": ["先頭列の user_id を指定していないので、並び順をそのまま使えないから", "created_at が日付型だから", "複合インデックスは等号でしか使えないから"], "answer": 0, "explain": "複合インデックスは user_id 順、その中で created_at 順に並んでいる。user_id を飛ばすと created_at はばらばらに散っているので、基本的には効率よく使えない（PostgreSQL 18 や MySQL 8.0.13 以降はスキップスキャンで使える場合もあるが、user_id の種類が多いと効果は薄い）。必要なら created_at 単独のインデックスを作る。", "ref": "#checker"},
  {"file": "db-index-transaction.html", "title": "インデックスとトランザクション", "q": "email にインデックスがあるのに WHERE lower(email) = 'a@example.com' が全件スキャンになる。対策は？", "choices": ["email のインデックスを作り直す", "lower(email) の式インデックスを作る", "LIKE に書き換える"], "answer": 1, "explain": "インデックスは email の値の順に並んでいて、lower(email) の順ではない。関数をかけた結果で探すなら、その式自体にインデックスを作る。", "ref": "#like"},
  {"file": "db-index-transaction.html", "title": "インデックスとトランザクション", "q": "既定の READ COMMITTED で「在庫を SELECT → アプリで -1 → UPDATE で書き戻す」処理を同時に 2 件実行したら、2 個売れたのに在庫が 1 しか減らなかった。一番シンプルな対策は？", "choices": ["分離レベルを READ UNCOMMITTED にする", "SELECT を 2 回実行して値を確認する", "UPDATE items SET stock = stock - 1 のように DB 側で計算する"], "answer": 2, "explain": "読んだ値を書き戻す方式は、READ COMMITTED では更新の取りこぼしが起きる。stock = stock - 1 なら UPDATE 時の最新値に対して計算されるので取りこぼさない。複雑な判定が必要なら SELECT ... FOR UPDATE。", "ref": "#lost-fix"},
  {"file": "db-index-transaction.html", "title": "インデックスとトランザクション", "q": "PostgreSQL で、夜間バッチが長時間トランザクションを開いたままにしていたら、更新の多いテーブルがどんどん膨らんだ。主な原因は？", "choices": ["WAL がデータファイルに反映されないから", "そのトランザクションから見える可能性のある古い行の版を、VACUUM が消せないから", "インデックスが自動で増えるから"], "answer": 1, "explain": "MVCC では更新のたびに新しい版ができる。まだ実行中の古いトランザクションが見る可能性のある版は片付けられないので、溜まり続ける。", "ref": "#mvcc"},
  {"file": "db-index-transaction.html", "title": "インデックスとトランザクション", "q": "SERIALIZABLE に上げたら、まれに「could not serialize access」エラーが出るようになった。どう扱う？", "choices": ["DB の不具合なので READ COMMITTED に戻す", "想定どおりの挙動なので、トランザクションを最初からリトライする", "エラーを無視して処理を続ける"], "answer": 1, "explain": "SERIALIZABLE は、直列に実行した場合と矛盾する組み合わせを検出すると片方をエラーにして守る。アプリ側でトランザクションごとやり直す前提で使う。", "ref": "#isolation"},
  {"file": "css-layout.html", "title": "CSS レイアウト", "q": "ヘッダーにロゴとメニューとログインボタンを 1 行に並べ、ロゴは左、残りは右に寄せたい。素直な書き方は？", "choices": ["Grid で 3 列の固定幅を指定する", "Flex で並べ、メニューに margin-left: auto を付ける", "float: right を使う"], "answer": 1, "explain": "1 列に並べて余白を分ける場面は Flex。margin-left: auto はその要素の左に余りを全部入れて右に押し出す。", "ref": "#which"},
  {"file": "css-layout.html", "title": "CSS レイアウト", "q": "記事カード部品を、メインカラムでは横並び、狭いサイドバーでは縦並びで表示したい。画面幅は同じ。使うべきものは？", "choices": ["メディアクエリ", "コンテナクエリ", "flex-wrap"], "answer": 1, "explain": "画面幅ではなく、カードが置かれた場所の幅で切り替えたいのでコンテナクエリ。", "ref": "#cq"},
  {"file": "css-layout.html", "title": "CSS レイアウト", "q": "UI ライブラリの CSS（#app .btn のような詳細度の高いセレクタ）を、自分の .btn-primary で上書きしたい。!important を使わない方法は？", "choices": ["ライブラリを低いカスケードレイヤーに入れて読み込む", "自分のセレクタに ID を足して詳細度を上げる", "自分の CSS を先に読み込む"], "answer": 0, "explain": "レイヤーの順位は詳細度より先に比べられる。ライブラリを下の層に入れれば、詳細度に関係なく自分のスタイルが勝つ。", "ref": "#cascade"},
  {"file": "css-layout.html", "title": "CSS レイアウト", "q": "モーダルに z-index: 9999 を付けたのに、別のヘッダーの下に隠れる。モーダルの親には transform が付いている。原因は？", "choices": ["z-index の上限が 999 だから", "親の transform が新しい重ね合わせコンテキストを作り、その中でしか比べられないから", "position: static のままだから z-index が効いていない"], "answer": 1, "explain": "transform などは重ね合わせコンテキストを作る。子の z-index はその中だけの順位になり、外のヘッダーとは親同士で比べられる。", "ref": "#myths"},
  {"file": "component-design.html", "title": "コンポーネント設計", "q": "atoms / molecules / organisms のフォルダ構成で、「カート」の仕様変更のたびに 3 つのフォルダを行き来している。根本的な改善は？", "choices": ["機能（features/cart）ごとにまとめ、業務を知らない共通部品だけを ui/ に置く", "templates/ フォルダを追加してまとめる", "カート関連の部品をすべて organisms に移す", "部品をさらに細かく atoms に分解する"], "answer": 0, "explain": "粒度での分類は変更の理由と無関係なので、1 機能の修正が散らばる。機能単位に置けば変更がフォルダ内で完結する。", "ref": "#folders"},
  {"file": "component-design.html", "title": "コンポーネント設計", "q": "自作のモーダルで、Esc で閉じない・Tab で背後の要素に移ってしまう、という指摘を受けた。見た目は今のまま変えたくない。どうする？", "choices": ["見た目ごと UI ライブラリの既製モーダルに置き換える", "Esc キーのイベントだけ追加して様子を見る", "Headless UI（または <dialog> 要素）に振る舞いを任せ、今のスタイルを当てる", "モーダルをやめて別ページに遷移させる"], "answer": 2, "explain": "Headless は振る舞い（キー操作・フォーカス管理・ARIA）だけを提供するので、見た目を保ったまま難しい部分を任せられる。", "ref": "#headless"},
  {"file": "component-design.html", "title": "コンポーネント設計", "q": "Button に primary・danger・outline などの真偽値 props が増え、同時に true にされると見た目が壊れる。設計の直し方は？", "choices": ["props の数を減らすため、className を直接渡させる", "同時に成り立たないものを variant: 'primary' | 'danger' … の 1 つの型にまとめる", "真偽値の組み合わせごとに別のコンポーネントを作る", "優先順位をコメントで書いておく"], "answer": 1, "explain": "排他的な選択肢を union 型にすれば、ありえない組み合わせを型で防げる。", "ref": "#c-variant"},
  {"file": "component-design.html", "title": "コンポーネント設計", "q": "ある機能のために作った日付ピッカーを、別の機能でも使いたくなった（まだ 2 か所目）。進め方として無難なのは？", "choices": ["すぐに汎用化し、想定される全オプションを props に用意して ui/ に置く", "既存のものを import して使い、3 か所目で形が見えたら業務の言葉を抜いて ui/ に移す", "npm パッケージとして切り出して公開する", "2 か所目の機能用にゼロから作り直す"], "answer": 1, "explain": "早すぎる共通化は想像上の要件で props を膨らませる。実際の使われ方が 3 つ揃ってから共通化するほうが筋がよい。", "ref": "#folders"},
  {"file": "color-basics.html", "title": "色の基礎", "q": "本文 15px のグレー文字を白背景に置いたら、コントラスト比が 3.8:1 だった。WCAG AA を満たすにはどうする？", "choices": ["そのままで良い（3:1 以上なので合格）", "文字色を濃くして 4.5:1 以上にする", "文字を太字にすれば 3.8:1 のままで合格", "背景を少しだけ灰色にする"], "answer": 1, "explain": "通常サイズの文字は 4.5:1 が基準。3:1 で良いのは大きな文字や UI 部品。背景を灰色にすると比率はさらに下がる。", "ref": "#contrast"},
  {"file": "color-basics.html", "title": "色の基礎", "q": "色相だけを変えて「明るさのそろった」タグの色を 6 色作りたい。どの方法が向いている？", "choices": ["oklch() の L と C を固定して H だけ変える", "hsl() の L と S を固定して H だけ変える", "rgb() の合計値をそろえる", "16 進コードの先頭の桁をそろえる"], "answer": 0, "explain": "OKLCH の L は見た目の明るさにほぼ比例する。HSL の L は同じでも黄色は明るく青は暗く見える。", "ref": "#hsl-vs-oklch"},
  {"file": "color-basics.html", "title": "色の基礎", "q": "ダークモードで、カードが背景に埋もれて境界がわからない。影を濃くしても改善しない。どうする？", "choices": ["カードの面を背景より一段明るい色にする", "背景を純黒 #000 にする", "カードに白い太枠を付ける", "カードを半透明にする"], "answer": 0, "explain": "暗い背景では影が見えにくい。ダークモードでは「上にあるものほど明るい面」で重なりを表す。", "ref": "#dark"},
  {"file": "color-basics.html", "title": "色の基礎", "q": "サーバーの状態一覧で、稼働中を緑の丸、停止を赤の丸だけで表示している。何が問題？", "choices": ["緑と赤は印刷すると同じ色になる", "丸はアイコンとして小さすぎる", "赤と緑を見分けにくい人には状態が伝わらない", "特に問題はない"], "answer": 2, "explain": "色だけで意味を伝えると、色覚の個人差で情報が失われる。アイコンの形や文字ラベルを併用する。", "ref": "#meaning"},
  {"file": "cloudflare-databases.html", "title": "D1 と Hyperdrive＋PlanetScale", "q": "Workers から AWS 上の既存 Postgres に直接つないだら、簡単な SELECT でも毎回遅い。まず入れるべきものは？", "choices": ["D1 の読み取りレプリカ", "KV にすべてのデータを移す", "Hyperdrive（接続プールとキャッシュ）"], "answer": 2, "explain": "Worker はリクエストごとに起動するので、直接つなぐと毎回 TCP・TLS・認証の往復をやり直す。Hyperdrive が DB への接続をプールしておくので、その往復がほぼ消える。", "ref": "#why-hyperdrive"},
  {"file": "cloudflare-databases.html", "title": "D1 と Hyperdrive＋PlanetScale", "q": "SaaS の各顧客企業に独立したデータを持たせたい。1社あたり数百 MB で、Postgres 固有の機能は使わない。素直な構成は？", "choices": ["D1 で顧客ごとに DB を1つずつ作る", "Hyperdrive だけを契約する", "PlanetScale の1つの DB に全社を入れ、D1 の読み取りレプリカで速くする"], "answer": 0, "explain": "D1 は1つの DB を小さく保ち、大量に作って分ける前提のサービス。テナントごとに分ければ書き込みも自然に散る。Hyperdrive は DB ではないので単体では使えない。", "ref": "#compare"},
  {"file": "cloudflare-databases.html", "title": "D1 と Hyperdrive＋PlanetScale", "q": "Hyperdrive 経由の PlanetScale を使っている。プロフィールを更新した直後の画面で、古い名前が表示されることがある。原因として考えられるのは？", "choices": ["PlanetScale の書き込みが失敗している", "Hyperdrive の読み取りクエリのキャッシュが古い結果を返している", "Placement の設定が間違っている"], "answer": 1, "explain": "Hyperdrive は読み取りクエリの結果を既定でキャッシュし、書き込みがあってもキャッシュを消さない。書いた直後に読む画面では、キャッシュを無効にした別の Hyperdrive 設定（バインディング）を経由して読む。", "ref": "#myths"},
  {"file": "cloudflare-databases.html", "title": "D1 と Hyperdrive＋PlanetScale", "q": "PlanetScale の DB は us-east-1 にある。Worker が各国の最寄りで動くため、1リクエストで何本もクエリを投げる API が遅い。効く対策は？", "choices": ["D1 の読み取りレプリカを増やす", "クエリを並列にしてさらに本数を増やす", "Placement で Worker を DB の近く（aws:us-east-1）で動かす"], "answer": 2, "explain": "クエリのたびに Worker と DB の間を往復するので、距離 × 本数だけ遅くなる。Worker を DB の近くで動かせば、ユーザーとの往復は1回、DB との往復は短くなる。", "ref": "#arch"},
  {"file": "cloudflare-databases.html", "title": "D1 と Hyperdrive＋PlanetScale", "q": "D1 で1つの DB に全ユーザーの書き込みが集中し、遅くなってきた。読み取りレプリカを有効にすれば解決する？", "choices": ["解決する。レプリカが書き込みも分担するから", "解決しない。レプリカは読み取り専用なので、書き込みは DB を分けて散らす", "解決する。レプリカがあると書き込みがキャッシュされるから"], "answer": 1, "explain": "D1 の各 DB はシングルスレッドで、書き込みはプライマリに集まる。書き込みを増やしたいなら DB を分けるか、共有データが中心なら PlanetScale のようなサーバー型 DB を検討する。", "ref": "#myths"},
  {"file": "browser-rendering.html", "title": "ブラウザのレンダリング", "q": "モーダルを右からスライドインさせたい。メインスレッドが重いときでもカクつきにくい書き方は？", "choices": ["left を -100% から 0 へアニメーションする", "transform: translateX(100%) から 0 へアニメーションする", "width を 0 から 400px へアニメーションする"], "answer": 1, "explain": "transform と opacity は合成だけで済み、コンポジタースレッドで動かせる。left や width は毎フレームレイアウトが走る。", "ref": "#cost"},
  {"file": "browser-rendering.html", "title": "ブラウザのレンダリング", "q": "アプリ本体の JS（複数ファイル、実行順が大事）を head に置きたい。HTML の解析を止めず、順番も守るには？", "choices": ["async を付ける", "defer を付ける", "何も付けずに body の先頭に置く"], "answer": 1, "explain": "defer は取得を並行して進め、解析後に書いた順で実行する。async は取れた順に実行するので順番が崩れうる。", "ref": "#blocking"},
  {"file": "browser-rendering.html", "title": "ブラウザのレンダリング", "q": "リストの各要素の幅を、ループ内で container.offsetWidth を読みながら設定したら極端に遅くなった。原因は？", "choices": ["offsetWidth の読み取りが、直前のスタイル変更を反映するためにその場でレイアウトを強制するから", "style.width への代入はペイントを毎回走らせるから", "ループの中で DOM を参照すること自体が遅いから"], "answer": 0, "explain": "書いた直後に読むと強制同期レイアウトが発生し、要素数だけレイアウトが走る。読みをループの外に出す。", "ref": "#thrash"},
  {"file": "browser-rendering.html", "title": "ブラウザのレンダリング", "q": "クリックしても数百 ms 反応しない。Performance パネルでは 1 つのタスクが 400ms 走っていた。まず考える対策は？", "choices": ["処理を分割して合間にブラウザへ制御を返すか、Web Worker に移す", "will-change: transform を付ける", "CSS を小さくする"], "answer": 0, "explain": "メインスレッドのロングタスク中は入力処理も描画もできない。分割するか別スレッドに逃がす。", "ref": "#frame"},
  {"file": "architecture-compare.html", "title": "アーキテクチャ比較", "q": "レイヤードアーキテクチャと、オニオン・クリーン・ヘキサゴナルとの一番大きな違いは？", "choices": ["層の数", "依存の向き（DB に向かうか、ドメインに向かうか）", "使えるプログラミング言語", "フロントエンドを含むかどうか"], "answer": 1, "explain": "レイヤードは上位が下位（DB 側）に依存する。他の 3 つは依存性逆転で外側がドメインに依存する。", "ref": "#difference"},
  {"file": "architecture-compare.html", "title": "アーキテクチャ比較", "q": "ヘキサゴナルアーキテクチャで、Web API の Controller とテストコードはどちらも同じ側に描かれる。その理由は？", "choices": ["どちらも DB に接続するから", "どちらもアプリケーションを呼び出す側（Driving）のアダプターだから", "どちらも六角形の中にあるから", "どちらもポートを実装するから"], "answer": 1, "explain": "左側はアプリを駆動する側。テストも Web も同じポートからアプリを呼ぶので、同じ入口から検証できる。", "ref": "#hexagonal"},
  {"file": "architecture-compare.html", "title": "アーキテクチャ比較", "q": "業務ルールはほとんどなく、画面とテーブルが 1 対 1 に近い社内ツールを作る。まず選ぶ構成として妥当なのは？", "choices": ["クリーンアーキテクチャを Presenter まで完全に実装する", "オニオンでドメインを 4 層に分ける", "レイヤード（フレームワーク標準の構成）で始める", "マイクロサービスに分割する"], "answer": 2, "explain": "守るべき業務ルールが薄いなら、層を増やしてもコストに見合わない。必要になってから DIP を入れればよい。", "ref": "#choose"},
  {"file": "architecture-compare.html", "title": "アーキテクチャ比較", "q": "ヘキサゴナルの「ポート」は、オニオンアーキテクチャでは主に何に当たる？", "choices": ["ドメイン側に置くリポジトリなどの interface", "外周の UI 層", "データベースそのもの", "アプリケーションサービスの実装クラス"], "answer": 0, "explain": "どちらも「内側が定義し、外側が実装する約束」。名前が違うだけで役割は同じ。", "ref": "#mapping"},
  {"file": "api-styles.html", "title": "REST・GraphQL・gRPC・tRPC", "q": "外部の開発者向けに公開する天気 API を作る。CDN でキャッシュして負荷を下げたい。合う方式は？", "choices": ["GraphQL", "gRPC", "REST + OpenAPI"], "answer": 2, "explain": "GET の URL ごとに HTTP キャッシュがそのまま効き、どの言語からも呼べる。OpenAPI でドキュメントとクライアント生成もできる。", "ref": "#choose"},
  {"file": "api-styles.html", "title": "REST・GraphQL・gRPC・tRPC", "q": "GraphQL で記事一覧と各記事の著者を返したら、DB への問い合わせが記事数 + 1 回になった。定番の対策は？", "choices": ["DataLoader で同じリクエスト内の著者取得をまとめる", "クエリの深さ制限を設ける", "HTTP キャッシュを有効にする"], "answer": 0, "explain": "フィールドごとにリゾルバが呼ばれる N+1 問題。DataLoader が ID を集めて 1 回の問い合わせにまとめる。", "ref": "#a-gql"},
  {"file": "api-styles.html", "title": "REST・GraphQL・gRPC・tRPC", "q": "支払い API の POST がタイムアウトした。クライアントが安全に再送できるようにするには？", "choices": ["POST を GET に変える", "Idempotency-Key を付け、サーバーは同じキーの 2 回目を処理せず前回の結果を返す", "タイムアウトを長くするだけでよい"], "answer": 1, "explain": "POST は冪等ではないので、そのまま再送すると二重決済になりうる。キーで重複を判定する。", "ref": "#rest-basics"},
  {"file": "api-styles.html", "title": "REST・GraphQL・gRPC・tRPC", "q": "ログインはしているが、他人の注文を見ようとしたユーザーに返すステータスとして適切なのは？", "choices": ["401 Unauthorized", "403 Forbidden（存在を隠したいなら 404）", "400 Bad Request"], "answer": 1, "explain": "401 は認証されていないとき。認証済みで権限がないなら 403。注文の存在自体を知られたくなければ 404 を返す。", "ref": "#status"},
  {"file": "api-styles.html", "title": "REST・GraphQL・gRPC・tRPC", "q": "新着順のタイムラインを無限スクロールで出す。読んでいる間に新しい投稿が増えても重複や抜けが出ないページングは？", "choices": ["?page=N のオフセット方式", "最後に見た位置を指すカーソル方式", "全件を一度に返す"], "answer": 1, "explain": "オフセットは先頭に追加があると位置がずれる。カーソルは「この投稿の続き」を指すのでずれない。", "ref": "#paging"},
  {"file": "a11y-checklist.html", "title": "アクセシビリティ チェックリスト", "q": "クリックで動く要素を <div onclick> で作っている。キーボード利用者のために最も手間が少なく確実な直し方は？", "choices": ["role=\"button\" を付ける", "tabindex=\"0\" を付ける", "<button> 要素に置き換える", "aria-label を付ける"], "answer": 2, "explain": "<button> にすれば Tab での到達、Enter / Space での実行、「ボタン」としての読み上げが最初から付く。div に role や tabindex を足してもキー操作は自前で実装が必要。", "ref": "#k-button"},
  {"file": "a11y-checklist.html", "title": "アクセシビリティ チェックリスト", "q": "デザイナーから「クリックしたときの青い枠が見た目に悪い」と言われた。キーボード利用者を困らせずに対応するには？", "choices": ["outline: none で全部消す", ":focus-visible で、主にキーボード操作時に枠を出す", "枠の色を背景と同じにする", "hover 時だけ枠を出す"], "answer": 1, "explain": ":focus-visible はブラウザがフォーカス表示を必要と判断したときに一致する。ボタンのマウスクリックでは通常一致しないので、キーボード利用者には枠を残しつつクリック時は出さずに済む。", "ref": "#k-focus"},
  {"file": "a11y-checklist.html", "title": "アクセシビリティ チェックリスト", "q": "入力欄にラベルを付けず、placeholder に「メールアドレス」と書いている。何が問題？", "choices": ["入力を始めると説明が消え、何の欄か確かめられなくなる", "placeholder は検索エンジンに読まれない", "placeholder はスマホで表示されない", "特に問題はない"], "answer": 0, "explain": "placeholder はラベルの代わりにならない。<label> を紐づけると、読み上げでも常に名前が伝わる。", "ref": "#c-form"},
  {"file": "a11y-checklist.html", "title": "アクセシビリティ チェックリスト", "q": "「保存しました」というトーストを表示しているが、スクリーンリーダーで読み上げられない。どうする？", "choices": ["トーストを 10 秒以上表示する", "トーストに alt 属性を付ける", "トーストの文字を大きくする", "role=\"status\"（aria-live）の入れ物を先に置き、中身を書き換える"], "answer": 3, "explain": "ライブリージョンは「変化」を読み上げる仕組み。入れ物ごと後から追加すると気づかれないことがあるので、先に置いておく。", "ref": "#k-live"},
  {"file": "a11y-checklist.html", "title": "アクセシビリティ チェックリスト", "q": "Lighthouse のアクセシビリティスコアが 100 点になった。リリース前に追加でやるべきことは？", "choices": ["特になし。100 点なら基準を満たしている", "キーボードだけでの操作と、スクリーンリーダーでの読み上げを手で確かめる", "スコアが下がらないよう ARIA を全要素に付ける", "別の自動チェックツールで同じ確認を繰り返す"], "answer": 1, "explain": "自動チェックで見つかるのは一部。操作順・フォーカスの見え方・読み上げ内容の正しさは人が確かめる必要がある。", "ref": "#test"},
  {"file": "vue-vs-svelte.html", "title": "Vue と Svelte", "q": "Vue の <script setup> で const count = ref(0) とし、関数の中で count++ と書いたが動かない。どう書く？", "choices": ["this.count++", "count.value++", "count = count + 1"], "answer": 1, "explain": "script の中では .value で読み書きする。テンプレートの中では自動で .value が外れる。", "ref": "#counter"},
  {"file": "vue-vs-svelte.html", "title": "Vue と Svelte", "q": "Svelte 4 で配列に arr.push(x) したのに、画面が更新されない。理由は？", "choices": ["push の結果は次のフレームまで反映されないから", "Svelte では配列をリアクティブにできないから", "代入文を検知する方式で、push は代入ではないから"], "answer": 2, "explain": "Svelte 4 では arr = [...arr, x] のように代入が必要だった。Svelte 5 の $state は Proxy で深く追跡するので push も検知される。", "ref": "#s4"},
  {"file": "vue-vs-svelte.html", "title": "Vue と Svelte", "q": "Svelte 5 で、複数のコンポーネントで共有するリアクティブな状態を、コンポーネントの外に切り出したい。どうする？", "choices": [".svelte.js / .svelte.ts ファイルで $state を使う", "外には切り出せないので親コンポーネントに置く", "普通の .js ファイルで let を export する"], "answer": 0, "explain": "runes は明示的な目印なので、.svelte.js などのファイルでも使える。Svelte 4 の書き方ではコンポーネントの外で使えなかった。", "ref": "#s5"},
  {"file": "vue-vs-svelte.html", "title": "Vue と Svelte", "q": "既存の大きな Vue アプリで、更新の多い一部のコンポーネントだけ仮想 DOM なしの方式にしたい。どうする？", "choices": ["そのコンポーネントだけ <script setup vapor> にする", "Options API のまま vapor オプションを付ける", "アプリ全体を一度に Vapor Mode へ書き換える"], "answer": 0, "explain": "Vapor Mode はコンポーネント単位で選べ、少しずつ移行できる。<script setup> 専用で Options API には対応しない。", "ref": "#vue-internals"},
  {"file": "vue-vs-svelte.html", "title": "Vue と Svelte", "q": "Vue の reactive なオブジェクトで、どの描画や computed からも読まれていないプロパティを変更した。何が起きる？", "choices": ["そのオブジェクトを持つコンポーネントがすべて再描画される", "何も再実行されない", "アプリ全体の仮想 DOM が比較し直される"], "answer": 1, "explain": "Proxy は読まれたときに「どの処理が読んだか」を記録し、書かれたときにその処理だけを再実行する。", "ref": "#vue-internals"},
  {"file": "typescript.html", "title": "TypeScript 学習フローと仕組み", "q": "API のレスポンスに User 型を付けて使っていたら、実行時に想定と違う形のデータが来て落ちた。どう防ぐ？", "choices": ["型は実行前に消えるので、zod などで実行時に検証する", "strict: true にすれば実行時にもチェックされる", "型注釈をもっと厳密に書けば、実行時にもチェックされる"], "answer": 0, "explain": "型は開発時だけ働き、出力される JS には残らない（型消去）。外部から来るデータは実行時に検証する。", "ref": "#erasure"},
  {"file": "typescript.html", "title": "TypeScript 学習フローと仕組み", "q": "Vite のプロジェクトで、型エラーがあるのにビルドが通って画面も動いてしまう。型エラーを確実に止めるには？", "choices": ["型エラーがあると Vite は本来ビルドを止めるので、設定が壊れている", "CI で tsc --noEmit を実行する", "vite build のオプションで型チェックを有効にする"], "answer": 1, "explain": "Vite（Oxc）や SWC は型を削るだけで、型を理解しない。型の検査は tsc やエディタが担当する。", "ref": "#tools"},
  {"file": "typescript.html", "title": "TypeScript 学習フローと仕組み", "q": "node app.ts で TypeScript を直接実行したら、enum を使った箇所でエラーになった。理由は？", "choices": ["Node は .ts ファイルを実行できない", "Node は型を消すだけなので、JS を生成する enum は使えない", "Node は型チェックをしていて、enum が型エラーになった"], "answer": 1, "explain": "erasableSyntaxOnly を有効にすると、消すだけでは済まない構文を事前に検出できる。", "ref": "#w3"},
  {"file": "typescript.html", "title": "TypeScript 学習フローと仕組み", "q": "外部ライブラリから受け取った値の型がわからない。どう受けるのがよい？", "choices": ["とりあえず string と書いておく", "any で受けてそのまま使う", "unknown で受け、絞り込んでから使う"], "answer": 2, "explain": "any はチェックを止めてしまう。unknown なら絞り込むまで使えないので安全。", "ref": "#myths"},
  {"file": "typescript.html", "title": "TypeScript 学習フローと仕組み", "q": "type Point = { x: number; y: number } を受け取る関数に、変数に入れておいた { x: 1, y: 2, z: 3 } を渡した。どうなる？", "choices": ["渡せる。持っているプロパティの形で判断するから", "エラー。型の名前が Point ではないから", "エラー。余分な z があるから"], "answer": 0, "explain": "ただし、オブジェクトリテラルを引数に直接書いた場合だけは、余分なプロパティもエラーになる（excess property check）。", "ref": "#structural"},
  {"file": "tsrs-vs-tsgo.html", "title": "tsrs と tsgo の比較", "q": "CI と本番ビルドの型チェックを速くしたい。公式サポートと互換性を最優先するなら、どちらを使う？", "choices": ["esbuild", "tsrs", "tsgo"], "answer": 2, "explain": "tsgo は公式の正式版。tsrs は実験版で、診断の順序などに差異があるため、試すなら結果を tsgo と突き合わせる。", "ref": "#choose"},
  {"file": "tsrs-vs-tsgo.html", "title": "tsrs と tsgo の比較", "q": "プロジェクトで typescript-eslint など TypeScript の API に依存するツールを使っている。TypeScript 7.0 に移行するときの注意点は？", "choices": ["7.0 には安定したプログラム API がないので、当面は TypeScript 6 系と併用する", "API 依存のツールも自動で 10 倍速くなる", "7.0 にすると typescript-eslint は使えなくなるので削除する"], "answer": 0, "explain": "API に依存するツールは 7.1 待ち。それまでは @typescript/typescript6（tsc6）と併用する。", "ref": "#myths"},
  {"file": "tsrs-vs-tsgo.html", "title": "tsrs と tsgo の比較", "q": "ビルドに swc や esbuild を使っている。これで型チェックも済んでいる？", "choices": ["済んでいる。tsrs と同じ仕組みで動いている", "済んでいない。型を剥がすだけなので、型チェックは tsc（tsgo）などで別に行う", "済んでいる。Rust / Go 製なので型チェックも速く行う"], "answer": 1, "explain": "tsgo と tsrs は型チェックまでやる本物のコンパイラ。swc / esbuild / Biome は型を剥がすだけ。", "ref": "#myths"},
  {"file": "tsrs-vs-tsgo.html", "title": "tsrs と tsgo の比較", "q": "ブラウザやサンドボックスの中で TypeScript の型チェックを動かしたい。候補とその制約は？", "choices": ["tsrs の Wasm 版（シングルスレッドで LSP なし）", "ブラウザで型チェックを動かす方法は、まだない", "tsgo の Wasm 版。ネイティブ版と同じ速さで動く"], "answer": 0, "explain": "Go は GC を同梱する必要があり Wasm に不向き。tsrs は所有権とアリーナで管理するので Wasm にしやすい。", "ref": "#p-mem"},
  {"file": "tsrs-vs-tsgo.html", "title": "tsrs と tsgo の比較", "q": "tsgo で --checkers の数を増やしたら型チェックは速くなったが、メモリ使用量も増えた。理由は？", "choices": ["checker を増やすと AST がファイルごとに複製される", "checker ごとに型キャッシュを持ち、同じ型を重複して計算するから", "checker の数とメモリは関係なく、GC の不具合"], "answer": 1, "explain": "AST やシンボルは全 checker で共有するが、型キャッシュは checker ごと。速さとメモリのトレードオフになる。", "ref": "#p-go"},
  {"file": "reactivity-models.html", "title": "UI 更新の3つの方式", "q": "App が count を持ち、子の Counter に渡して表示している。React（メモ化なし）で count を 1 増やすと、どのコンポーネント関数が再実行される？", "choices": ["Counter だけ", "どの関数も再実行されず、テキストだけが書き換わる", "App とその子孫（Header・Counter・List）すべて"], "answer": 2, "explain": "仮想 DOM 方式は状態を持つコンポーネントから下を作り直して比べる。最終的に書き換わる DOM はテキスト 1 つでも、そこまでの仕事が多い。", "ref": "#same-op"},
  {"file": "reactivity-models.html", "title": "UI 更新の3つの方式", "q": "シグナル方式（Solid など）で同じように count を 1 増やすと、何が動く？", "choices": ["count を読んだ effect（そのテキストの更新）だけ", "アプリ全体の差分計算が走る", "count を持つコンポーネント関数が再実行される"], "answer": 0, "explain": "シグナルは読んだ処理を購読者として記録しておき、書かれたときに購読者だけを再実行する。", "ref": "#signal"},
  {"file": "reactivity-models.html", "title": "UI 更新の3つの方式", "q": "シグナル方式で、シグナルの値を先に普通の変数に取り出してから表示に使ったら、値が変わっても表示が更新されない。理由は？", "choices": ["シグナルの値は、表示に直接使うことができないから", "読んだ瞬間に依存を記録するので、取り出すと追跡が切れるから", "変数に入れると値がコピーされず参照が壊れる"], "answer": 1, "explain": "Solid の props の分割代入でつまずくのも同じ理由。", "ref": "#signal"},
  {"file": "reactivity-models.html", "title": "UI 更新の3つの方式", "q": "React Compiler を導入すると、React の更新方式はどう変わる？", "choices": ["シグナル方式に切り替わり、コンポーネントは 1 回しか実行されなくなる", "再実行して比べる方式のまま、不要な再実行を減らすメモ化が自動で入る", "仮想 DOM がなくなり、直接 DOM を操作するコードになる"], "answer": 1, "explain": "React Compiler は memo / useMemo などを自動挿入するもので、更新の単位はコンポーネントのまま。", "ref": "#compiler"},
  {"file": "reactivity-models.html", "title": "UI 更新の3つの方式", "q": "仮想 DOM を使う価値として正しい説明は？", "choices": ["宣言的に書いても、そこそこ速く更新できること", "ビルドなしで、どのブラウザでも同じように動くこと", "本物の DOM を直接操作するより必ず速いこと"], "answer": 0, "explain": "仮想 DOM も最終的には本物の DOM を操作するので、最適な手書きの操作より速くはならない。", "ref": "#myths"},
  {"file": "react-vs-solid.html", "title": "React と Solid", "q": "React で setInterval の中に setCount(count + 1) を書いたら、1 から先に増えない。どう直す？", "choices": ["setInterval を useMemo で包む", "更新関数 setCount(c => c + 1) を使う", "count を const から let に変える"], "answer": 1, "explain": "interval の中の count は、そのレンダー時点の値で固定されている（古いクロージャ）。", "ref": "#p1"},
  {"file": "react-vs-solid.html", "title": "React と Solid", "q": "React で、条件によって if の中で useState を呼ぶようにしたら、別の state の値が入れ替わったようにおかしくなった。理由は？", "choices": ["値が呼び出し順で保存されていて、順番がずれると別の state を取り出すから", "if の中で作った state は、レンダーのたびに 0 に初期化されるから", "React Compiler が if の中を最適化で消してしまう"], "answer": 0, "explain": "関数は毎回最初から実行され、React は「1 番目の useState、2 番目の useState…」と順番で値を取り出す。", "ref": "#r2"},
  {"file": "react-vs-solid.html", "title": "React と Solid", "q": "Solid で function Row({ item }) と props を分割代入したら、item が変わっても表示が更新されない。どう直す？", "choices": ["props.item のまま使う", "useEffect で item を監視する", "Row を memo で包む"], "answer": 0, "explain": "分割代入した瞬間の値を取り出すので追跡が切れる。Solid のコンポーネントは一度しか実行されない。", "ref": "#p2"},
  {"file": "react-vs-solid.html", "title": "React と Solid", "q": "Solid のコンポーネントで if (!user()) return <Login /> と書いたら、ログインしても画面が切り替わらない。どうする？", "choices": ["user() の結果を createSignal に入れ直して読む", "親で key={user()} を付けて、毎回作り直させる", "<Show when={user()} fallback={<Login />}> を使う"], "answer": 2, "explain": "コンポーネント関数は最初の 1 回だけ実行されるので、早期 return は一度しか評価されない。", "ref": "#p2"},

// MEMOS:END

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const q = document.getElementById('q');
const tagBox = document.getElementById('tags');
let activeTag = null;

const allTags = [...new Set(MEMOS.flatMap(m => m.tags || []))].sort();
for (const t of allTags) {
  const b = document.createElement('button');
  b.className = 'tag';
  b.textContent = t;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => {
    activeTag = activeTag === t ? null : t;
    tagBox.querySelectorAll('.tag').forEach(x =>
      x.setAttribute('aria-pressed', String(x.textContent === activeTag)));
    render();
  };
  tagBox.appendChild(b);
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render() {
  const word = q.value.trim().toLowerCase();
  const items = MEMOS
    .filter(m => !activeTag || (m.tags || []).includes(activeTag))
    .filter(m => !word || [m.title, m.desc, ...(m.tags || [])].join(' ').toLowerCase().includes(word))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  list.innerHTML = items.map(m => `
    <a class="card" href="${esc(m.file)}">
      <h2>${esc(m.title)}</h2>
      <p>${esc(m.desc || '')}</p>
      <div class="meta">
        ${(m.tags || []).map(t => `<span class="t">${esc(t)}</span>`).join('')}
        ${m.date ? `<time>${esc(m.date)}</time>` : ''}
      </div>
    </a>`).join('');
  empty.hidden = items.length > 0;
}

q.addEventListener('input', render);
render();

document.getElementById('refresh').addEventListener('click', e => {
  const btn = e.currentTarget;
  btn.classList.add('spinning');
  btn.disabled = true;
  // GitHub Pages の CDN キャッシュを避け、最新の一覧を取りに行く
  const url = new URL(location.href);
  url.searchParams.set('_', Date.now());
  location.replace(url.pathname + url.search);
});

// ---- ランダムクイズ（全メモの確認クイズから 1 問。閉じている間は何もしない）
(() => {
  const box = document.getElementById('rq');
  const pool = typeof QUIZZES !== 'undefined' ? QUIZZES : [];
  if (!pool.length) return;
  box.hidden = false;
  box.querySelector('summary').textContent = `🎲 ランダムクイズ（${pool.length} 問）`;
  const $ = id => document.getElementById(id);
  let last = -1;

  function show() {
    let i = Math.floor(Math.random() * pool.length);
    if (pool.length > 1 && i === last) i = (i + 1) % pool.length;
    last = i;
    const q = pool[i];
    $('rq-from').textContent = q.title;
    $('rq-q').textContent = q.q;
    $('rq-fb').hidden = true;
    $('rq-link').hidden = true;
    // 選択肢は毎回シャッフル（正解の位置で覚えないように）
    const order = q.choices.map((_, k) => k).sort(() => Math.random() - 0.5);
    const ch = $('rq-choices');
    ch.textContent = '';
    for (const k of order) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rq-c';
      b.textContent = q.choices[k];
      b.dataset.k = k;
      b.onclick = () => answer(q, k);
      ch.appendChild(b);
    }
  }

  function answer(q, k) {
    const ok = k === q.answer;
    for (const b of $('rq-choices').children) {
      b.disabled = true;
      if (+b.dataset.k === q.answer) b.classList.add('ok');
      else if (+b.dataset.k === k) b.classList.add('ng');
    }
    const fb = $('rq-fb');
    fb.innerHTML = ok ? '<b class="ok">⭕ 正解</b> ' : '<b class="ng">❌ 不正解</b> ';
    fb.append((ok ? '' : `（正解: ${q.choices[q.answer]}）`) + (q.explain || ''));
    fb.hidden = false;
    const link = $('rq-link');
    link.href = q.file + (!ok && q.ref ? q.ref : '');
    link.textContent = ok ? 'このメモを読む →' : '本文で確認する →';
    link.hidden = false;
  }

  box.addEventListener('toggle', () => { if (box.open && last < 0) show(); });
  $('rq-next').onclick = show;
})();
</script>
